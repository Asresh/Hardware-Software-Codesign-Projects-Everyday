<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1000" width="1340" height="1000">
  <rect x="0" y="0" width="1340" height="1000" fill="#333a49"/>

  <defs>
    <marker id="dat" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#8fd0b0"/>
    </marker>
    <marker id="ctl" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#e8b45c"/>
    </marker>
    <marker id="irqm" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#e07a7a"/>
    </marker>
  </defs>

  <text x="28" y="42" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Day 19 - GPU-to-GPU peer transport engine (RDMA-style link for tensor-parallel inference)</text>
  <text x="28" y="70" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#b8cdd8">work/completion rings in shared memory &#183; MTU-segmented AXI4-Stream link &#183; credit-based flow control &#183; commit or fold on arrival</text>

  <!-- legend -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="15">
    <line x1="960" y1="60" x2="1000" y2="60" stroke="#8fd0b0" stroke-width="3" marker-end="url(#dat)"/>
    <text x="1008" y="65" fill="#8fd0b0">datapath</text>
    <line x1="1100" y1="60" x2="1140" y2="60" stroke="#e8b45c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ctl)"/>
    <text x="1148" y="65" fill="#e8b45c">control / credits</text>
  </g>

  <!-- ================= host ================= -->
  <rect x="28" y="96" width="250" height="76" rx="8" fill="#46536b" stroke="#a9c4d6" stroke-width="2.5"/>
  <text x="153" y="128" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">HOST / node control CPU</text>
  <text x="153" y="152" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#c3d4e0" text-anchor="middle">sw/p2p_driver.c - builds the ring, rings the doorbell</text>

  <!-- control bus -->
  <rect x="28" y="192" width="562" height="40" rx="5" fill="#3d475c" stroke="#e8b45c" stroke-width="2"/>
  <text x="40" y="209" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8b45c">AXI4-Lite control  AWADDR[11:0] AWVALID/AWREADY  WDATA[31:0] WSTRB[3:0] WVALID/WREADY  BRESP[1:0] BVALID/BREADY</text>
  <text x="40" y="226" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8b45c">                   ARADDR[11:0] ARVALID/ARREADY  RDATA[31:0] RRESP[1:0] RVALID/RREADY</text>
  <line x1="153" y1="172" x2="153" y2="190" stroke="#e8b45c" stroke-width="3" marker-end="url(#ctl)"/>

  <!-- ================= regfile ================= -->
  <rect x="28" y="256" width="250" height="188" rx="8" fill="#3f4a60" stroke="#8fd0b0" stroke-width="2.5"/>
  <text x="153" y="282" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">p2p_regfile</text>
  <text x="42" y="306" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">CTRL doorbell &#183; WQ_BASE/COUNT</text>
  <text x="42" y="325" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">CQ_BASE &#183; MEM_LIMIT &#183; CREDIT_LIM</text>
  <text x="42" y="344" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">INJECT &#183; ERR_CODE / ERR_INFO</text>
  <text x="42" y="363" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">11 statistics counters</text>
  <text x="42" y="382" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">credit-stall / link-stall / mem-stall</text>
  <text x="42" y="401" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">IRQ_EN &#183; IRQ_STAT (W1C) &#183; CAPS</text>
  <text x="42" y="424" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">run sequencer: START -&gt; BUSY -&gt; DONE</text>

  <!-- interrupt path -->
  <path d="M 258 256 L 258 182 L 278 182" fill="none" stroke="#e07a7a" stroke-width="3"/>
  <path d="M 278 182 L 278 134 L 282 134" fill="none" stroke="#e07a7a" stroke-width="3"/>
  <path d="M 282 134 L 300 134 L 300 96 L 153 96 L 153 90" fill="none" stroke="#e07a7a" stroke-width="3" marker-end="url(#irqm)"/>
  <text x="312" y="120" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#e07a7a">irq (done | error)</text>

  <!-- control fan-out to the datapath -->
  <path d="M 278 300 L 320 300" fill="none" stroke="#e8b45c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ctl)"/>
  <path d="M 278 350 L 300 350 L 300 470 L 320 470" fill="none" stroke="#e8b45c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ctl)"/>
  <path d="M 278 400 L 292 400 L 292 720 L 320 720" fill="none" stroke="#e8b45c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ctl)"/>

  <!-- ================= wqe fetch ================= -->
  <rect x="320" y="256" width="270" height="98" rx="8" fill="#3f4a60" stroke="#8fd0b0" stroke-width="2.5"/>
  <text x="455" y="281" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">p2p_wqe_fetch</text>
  <text x="334" y="304" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">8-word descriptor, 8 pipelined reads</text>
  <text x="334" y="323" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">validate: OP &gt; QP &gt; LEN &gt; ALIGN &gt; RANGE</text>
  <text x="334" y="342" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">reject &amp; keep draining, never half-send</text>

  <!-- ================= transmitter ================= -->
  <rect x="320" y="376" width="270" height="226" rx="8" fill="#3f4a60" stroke="#8fd0b0" stroke-width="2.5"/>
  <text x="455" y="401" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">p2p_tx  (segmentation)</text>
  <text x="334" y="424" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">CRED -&gt; H0 -&gt; H1 -&gt; PAY, one packet / credit</text>
  <text x="334" y="443" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">H0 = {tag, seq, flags, qp, len}   H1 = dst</text>
  <text x="334" y="462" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">per-QP seq (8b), per-QP credit counters</text>
  <rect x="334" y="476" width="242" height="46" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="455" y="495" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#dfe9f0" text-anchor="middle">p2p_fifo  payload staging</text>
  <text x="455" y="513" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#8fd0b0" text-anchor="middle">depth 8 x 32b (read runs ahead of wire)</text>
  <text x="334" y="543" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">prefetch starts on the header beats, so the</text>
  <text x="334" y="561" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">read pipeline never refills at a boundary</text>
  <text x="334" y="585" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">counts credit stalls and wire stalls apart</text>

  <!-- ================= receiver ================= -->
  <rect x="320" y="628" width="270" height="300" rx="8" fill="#3f4a60" stroke="#8fd0b0" stroke-width="2.5"/>
  <text x="455" y="653" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">p2p_rx  (reassembly / commit)</text>
  <text x="334" y="676" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">H0/H1 parse, per-QP expected-sequence check</text>
  <text x="334" y="695" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">gap -&gt; discard whole packet, resync, count</text>
  <rect x="334" y="706" width="242" height="66" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="455" y="725" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#dfe9f0" text-anchor="middle">packet buffer pool = the credits</text>
  <text x="455" y="744" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#8fd0b0" text-anchor="middle">RX_BUFS 4 slots x MTU 16 x 32b</text>
  <text x="455" y="763" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4" text-anchor="middle">land in one slot while another drains</text>
  <text x="334" y="793" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">WRITE: 1 word/clock straight to memory</text>
  <text x="334" y="812" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">ACCUM: dst += payload, 32-bit wrapping</text>
  <rect x="334" y="822" width="242" height="40" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="455" y="840" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#dfe9f0" text-anchor="middle">p2p_fifo  accumulate results</text>
  <text x="455" y="856" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#8fd0b0" text-anchor="middle">depth 8 x 32b (reads run ahead of writes)</text>
  <text x="334" y="884" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">last packet of a message -&gt; 4-word CQE</text>
  <text x="334" y="903" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">slots freed in order -&gt; credit returned</text>

  <!-- ================= read arbiter ================= -->
  <rect x="650" y="300" width="216" height="176" rx="8" fill="#3f4a60" stroke="#8fd0b0" stroke-width="2.5"/>
  <text x="758" y="325" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">p2p_rd_arb</text>
  <text x="662" y="348" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">round robin over 3 agents:</text>
  <text x="662" y="367" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">0 descriptor  1 tx payload</text>
  <text x="662" y="386" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">2 rx accumulate</text>
  <rect x="662" y="398" width="192" height="40" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="758" y="415" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#dfe9f0" text-anchor="middle">grant-order tag FIFO</text>
  <text x="758" y="432" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#8fd0b0" text-anchor="middle">depth 8 x 2b</text>
  <text x="662" y="461" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">AXI4-Lite answers in order,</text>

  <!-- agents into the arbiter -->
  <path d="M 590 305 L 650 330" fill="none" stroke="#8fd0b0" stroke-width="2.5" marker-end="url(#dat)"/>
  <path d="M 590 430 L 620 430 L 620 380 L 650 380" fill="none" stroke="#8fd0b0" stroke-width="2.5" marker-end="url(#dat)"/>
  <path d="M 590 840 L 636 840 L 636 440 L 650 440" fill="none" stroke="#8fd0b0" stroke-width="2.5" marker-end="url(#dat)"/>

  <!-- ================= masters ================= -->
  <rect x="900" y="300" width="200" height="104" rx="8" fill="#3f4a60" stroke="#8fd0b0" stroke-width="2.5"/>
  <text x="1000" y="325" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">p2p_axil_rd</text>
  <text x="912" y="348" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">AR ahead of R</text>
  <text x="912" y="367" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#8fd0b0">4 outstanding, in order</text>
  <text x="912" y="388" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">rready tied high</text>

  <rect x="900" y="500" width="200" height="104" rx="8" fill="#3f4a60" stroke="#8fd0b0" stroke-width="2.5"/>
  <text x="1000" y="525" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">p2p_axil_wr</text>
  <text x="912" y="548" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">AW and W independent</text>
  <text x="912" y="567" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#8fd0b0">4 outstanding</text>
  <text x="912" y="588" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">receive path owns it alone</text>

  <path d="M 866 388 L 900 352" fill="none" stroke="#8fd0b0" stroke-width="2.5" marker-end="url(#dat)"/>
  <path d="M 590 800 L 880 800 L 880 552 L 900 552" fill="none" stroke="#8fd0b0" stroke-width="2.5" marker-end="url(#dat)"/>
  <text x="646" y="792" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#8fd0b0">payload commit + completion entries</text>

  <!-- ================= memory ================= -->
  <rect x="1140" y="256" width="172" height="392" rx="8" fill="#46536b" stroke="#a9c4d6" stroke-width="2.5"/>
  <text x="1226" y="282" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">SHARED MEMORY</text>
  <rect x="1154" y="300" width="144" height="60" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="1226" y="322" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#dfe9f0" text-anchor="middle">work queue ring</text>
  <text x="1226" y="342" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4" text-anchor="middle">8 words / entry</text>
  <rect x="1154" y="374" width="144" height="60" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="1226" y="396" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#dfe9f0" text-anchor="middle">send buffers</text>
  <text x="1226" y="416" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4" text-anchor="middle">read by p2p_tx</text>
  <rect x="1154" y="448" width="144" height="60" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="1226" y="470" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#dfe9f0" text-anchor="middle">receive buffers</text>
  <text x="1226" y="490" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4" text-anchor="middle">written by p2p_rx</text>
  <rect x="1154" y="522" width="144" height="60" rx="5" fill="#4d5b74" stroke="#8fd0b0" stroke-width="1.6"/>
  <text x="1226" y="544" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#dfe9f0" text-anchor="middle">completion ring</text>
  <text x="1226" y="564" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4" text-anchor="middle">4 words / entry</text>
  <text x="1226" y="608" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4" text-anchor="middle">send and receive arenas</text>
  <text x="1226" y="626" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4" text-anchor="middle">never alias</text>

  <path d="M 1100 340 L 1140 340" fill="none" stroke="#8fd0b0" stroke-width="3" marker-end="url(#dat)"/>
  <text x="1010" y="288" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0" text-anchor="middle">ARADDR/ARVALID/ARREADY</text>
  <path d="M 1140 380 L 1100 380" fill="none" stroke="#8fd0b0" stroke-width="3" marker-end="url(#dat)"/>
  <text x="1010" y="418" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0" text-anchor="middle">RDATA[31:0]/RRESP/RVALID</text>
  <path d="M 1100 540 L 1140 540" fill="none" stroke="#8fd0b0" stroke-width="3" marker-end="url(#dat)"/>
  <text x="1012" y="628" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0" text-anchor="middle">AWADDR / WDATA[31:0] WSTRB</text>
  <path d="M 1140 578 L 1100 578" fill="none" stroke="#8fd0b0" stroke-width="3" marker-end="url(#dat)"/>
  <text x="1012" y="646" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0" text-anchor="middle">BRESP[1:0] BVALID/BREADY</text>

  <!-- ================= peer / link ================= -->
  <rect x="660" y="700" width="380" height="230" rx="8" fill="#46536b" stroke="#a9c4d6" stroke-width="2.5"/>
  <text x="850" y="726" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">PEER ENGINE (GPU 1) - identical instance</text>
  <text x="676" y="750" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">this engine's egress is the peer's ingress and back;</text>
  <text x="676" y="769" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">the testbench closes both loops on one instance</text>
  <text x="676" y="788" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9d8e2">through a registered stage with randomised delay.</text>
  <text x="676" y="826" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">packet = 2 header beats + up to MTU payload beats</text>
  <text x="676" y="845" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb6c4">link roofline = MTU/(MTU+2) = 0.889 words/clock</text>
  <text x="676" y="880" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8b45c">a credit is one free receive buffer; no credit, no packet</text>
  <text x="676" y="899" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8b45c">so the wire never has to drop and retransmit</text>

  <!-- egress -->
  <path d="M 590 540 L 612 540 L 612 736 L 660 736" fill="none" stroke="#8fd0b0" stroke-width="3" marker-end="url(#dat)"/>
  <text x="622" y="580" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0">egress AXI4-Stream</text>
  <text x="622" y="597" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0">TDATA[31:0] TVALID/TREADY</text>
  <text x="622" y="614" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0">TLAST  TUSER = start of packet</text>

  <!-- ingress -->
  <path d="M 660 668 L 606 668 L 606 660 L 590 660" fill="none" stroke="#8fd0b0" stroke-width="3" marker-end="url(#dat)"/>
  <path d="M 660 700 L 660 668" fill="none" stroke="#8fd0b0" stroke-width="3"/>
  <text x="668" y="662" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8fd0b0">ingress AXI4-Stream (peer's egress)</text>

  <!-- credit return -->
  <path d="M 660 908 L 624 908 L 624 490 L 590 490" fill="none" stroke="#e8b45c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ctl)"/>
  <text x="470" y="620" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#e8b45c">credit sideband CRO_VALID/QP/READY -&gt; CRI_VALID/QP</text>

  <!-- footnote -->
  <text x="28" y="962" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb6c4">Reads and writes are separate AXI channels owned by opposite directions of the link, so a full-duplex transfer moves one word out of memory and one word into memory on the same clock.</text>
  <text x="28" y="984" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#9fb6c4">The read channel is the only shared resource: descriptor fetch, transmit payload fetch and the receive accumulate fold contend for it through the round-robin arbiter and its grant-order tag FIFO.</text>
</svg>
