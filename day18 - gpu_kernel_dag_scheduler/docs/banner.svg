<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <rect x="0" y="0" width="1200" height="300" fill="#2b3242"/>
  <rect x="0" y="0" width="1200" height="8" fill="#6fa8c7"/>
  <rect x="0" y="292" width="1200" height="8" fill="#6fa8c7"/>

  <!-- day badge -->
  <rect x="44" y="60" width="150" height="150" rx="14" fill="#3d475c" stroke="#8fb8d0" stroke-width="3"/>
  <text x="119" y="128" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#c3d4e0" text-anchor="middle">DAY</text>
  <text x="119" y="188" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">18</text>

  <!-- title -->
  <text x="234" y="108" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#ffffff">Kernel-DAG Scheduler</text>
  <text x="234" y="152" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#b8cdd8">multi-GPU command processor &#183; associative dependency scoreboard</text>
  <text x="234" y="192" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#9fb6c4">CUDA-Graph launch in hardware &#183; AXI4-Lite control + pipelined memory master</text>

  <!-- a tiny DAG on the right, nodes retiring onto four devices -->
  <g stroke="#8fb8d0" stroke-width="2.5" fill="none">
    <path d="M 900 100 L 960 70"/>
    <path d="M 900 100 L 960 130"/>
    <path d="M 960 70 L 1030 100"/>
    <path d="M 960 130 L 1030 100"/>
    <path d="M 1030 100 L 1100 100"/>
  </g>
  <circle cx="900" cy="100" r="15" fill="#7fc4a0" stroke="#2b3242" stroke-width="2"/>
  <circle cx="960" cy="70"  r="15" fill="#e0b060" stroke="#2b3242" stroke-width="2"/>
  <circle cx="960" cy="130" r="15" fill="#e0b060" stroke="#2b3242" stroke-width="2"/>
  <circle cx="1030" cy="100" r="15" fill="#d08b8b" stroke="#2b3242" stroke-width="2"/>
  <circle cx="1100" cy="100" r="15" fill="#9d8fd0" stroke="#2b3242" stroke-width="2"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#9fb6c4">
    <text x="880" y="185">GPU0</text>
    <text x="945" y="185">GPU1</text>
    <text x="1010" y="185">GPU2</text>
    <text x="1080" y="185">GPU3</text>
  </g>
  <g fill="#4d5a70">
    <rect x="874" y="196" width="46" height="12" rx="3"/>
    <rect x="939" y="196" width="46" height="12" rx="3"/>
    <rect x="1004" y="196" width="46" height="12" rx="3"/>
    <rect x="1069" y="196" width="46" height="12" rx="3"/>
  </g>

  <!-- headline numbers -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#c3d4e0">
    <text x="234" y="240">0.985 nodes/clock peak dispatch</text>
    <text x="620" y="240">17.62x over scalar</text>
    <text x="860" y="240">0 mismatches</text>
  </g>
</svg>
