<!-- Author: Asresh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650" role="img" aria-labelledby="title desc">
  <title id="title">SerDes eye margin engine block diagram</title><desc id="desc">CPU APB control, streaming samples, FIFO, filter, run tracker, results and interrupt.</desc>
  <defs><marker id="data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker><marker id="ctrl" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/></marker></defs>
  <rect width="1400" height="650" fill="#475569"/>
  <text x="700" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Day 30 — streaming SerDes eye-margin measurement</text>
  <g font-family="sans-serif" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
    <rect x="45" y="145" width="215" height="150" rx="14" fill="#334155"/><text x="152" y="205" text-anchor="middle" font-size="24">Host CPU / PHY FW</text><text x="152" y="244" text-anchor="middle" font-size="17">configure · launch · ISR</text>
    <rect x="345" y="105" width="245" height="210" rx="14" fill="#334155"/><text x="467" y="150" text-anchor="middle" font-size="23">eye_apb_csr</text><text x="467" y="185" text-anchor="middle" font-size="16">ERROR_LIMIT</text><text x="467" y="212" text-anchor="middle" font-size="16">BEST_START / LENGTH</text><text x="467" y="239" text-anchor="middle" font-size="16">SAMPLE_COUNT / IRQ_STAT</text><text x="467" y="275" text-anchor="middle" font-size="16">sticky W1C interrupt</text>
    <rect x="345" y="400" width="245" height="125" rx="14" fill="#334155"/><text x="467" y="445" text-anchor="middle" font-size="23">eye_sample_fifo</text><text x="467" y="478" text-anchor="middle" font-size="17">8 × 24-bit entries</text><text x="467" y="505" text-anchor="middle" font-size="15">lossless ready/valid</text>
    <rect x="680" y="400" width="215" height="125" rx="14" fill="#334155"/><text x="787" y="447" text-anchor="middle" font-size="23">eye_error_filter</text><text x="787" y="483" text-anchor="middle" font-size="17">errors ≤ limit</text>
    <rect x="985" y="365" width="275" height="195" rx="14" fill="#334155"/><text x="1122" y="412" text-anchor="middle" font-size="23">eye_run_tracker</text><text x="1122" y="450" text-anchor="middle" font-size="16">current open run</text><text x="1122" y="478" text-anchor="middle" font-size="16">longest-run selector</text><text x="1122" y="506" text-anchor="middle" font-size="16">sample counter</text><text x="1122" y="534" text-anchor="middle" font-size="16">last → done</text>
    <rect x="45" y="420" width="215" height="105" rx="14" fill="#334155"/><text x="152" y="461" text-anchor="middle" font-size="22">SerDes sampler</text><text x="152" y="494" text-anchor="middle" font-size="16">phase / errors / last</text>
  </g>
  <g fill="none" stroke-width="4">
    <path d="M260 190 H345" stroke="#fbbf24" marker-end="url(#ctrl)"/><text x="302" y="176" text-anchor="middle" font-family="monospace" font-size="14" fill="#fde68a">PSEL PENABLE</text><text x="302" y="212" text-anchor="middle" font-family="monospace" font-size="14" fill="#fde68a">PWRITE PADDR</text><text x="302" y="231" text-anchor="middle" font-family="monospace" font-size="14" fill="#fde68a">PWDATA PRDATA</text>
    <path d="M260 472 H345" stroke="#38bdf8" marker-end="url(#data)"/><text x="302" y="451" text-anchor="middle" font-family="monospace" font-size="14" fill="#bae6fd">sample_valid</text><text x="302" y="503" text-anchor="middle" font-family="monospace" font-size="14" fill="#bae6fd">sample_ready</text>
    <path d="M590 462 H680" stroke="#38bdf8" marker-end="url(#data)"/><text x="635" y="447" text-anchor="middle" font-family="monospace" font-size="14" fill="#bae6fd">24-bit</text>
    <path d="M895 462 H985" stroke="#38bdf8" marker-end="url(#data)"/><text x="940" y="447" text-anchor="middle" font-family="monospace" font-size="14" fill="#bae6fd">open</text>
    <path d="M467 315 V400" stroke="#fbbf24" marker-end="url(#ctrl)"/><text x="482" y="365" font-family="monospace" font-size="14" fill="#fde68a">start/clear</text>
    <path d="M590 270 C850 270 1020 280 1122 365" stroke="#fbbf24" marker-end="url(#ctrl)"/><text x="820" y="255" text-anchor="middle" font-family="monospace" font-size="14" fill="#fde68a">error_limit</text>
    <path d="M1122 365 C1040 305 740 300 590 300" stroke="#fbbf24" marker-end="url(#ctrl)"/><text x="855" y="326" text-anchor="middle" font-family="monospace" font-size="14" fill="#fde68a">done + results</text>
    <path d="M345 125 C225 70 120 75 120 145" stroke="#fbbf24" marker-end="url(#ctrl)"/><text x="225" y="85" text-anchor="middle" font-family="monospace" font-size="15" fill="#fde68a">irq</text>
  </g>
  <text x="700" y="615" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#e2e8f0">Blue arrows: datapath · Amber arrows: control/status · Top module: serdes_eye_margin_top</text>
</svg>
