<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650">
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7de2d1"/></marker><marker id="ctrl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffd166"/></marker></defs>
 <rect width="1400" height="650" fill="#34495e"/>
 <g font-family="Arial,sans-serif" fill="#fff" stroke-width="3">
  <rect x="40" y="210" width="220" height="180" rx="15" fill="#5b6f82" stroke="#a8dadc"/>
  <text x="90" y="270" font-size="28" font-weight="700">CPU / DRIVER</text><text x="68" y="315" font-size="18">topk_run()</text><text x="68" y="345" font-size="18">source, destination, count</text>
  <rect x="335" y="55" width="265" height="155" rx="15" fill="#51697d" stroke="#ffd166"/>
  <text x="365" y="105" font-size="24" font-weight="700">MMIO + sequencer</text><text x="355" y="140" font-size="16">mmio_valid/write/addr/wdata</text><text x="355" y="170" font-size="16">mmio_ready/rdata</text>
  <rect x="335" y="270" width="265" height="150" rx="15" fill="#51697d" stroke="#7de2d1"/>
  <text x="365" y="320" font-size="24" font-weight="700">4-word collector</text><text x="365" y="355" font-size="17">8 × signed INT16 logits</text><text x="365" y="385" font-size="17">No FIFO: one command active</text>
  <rect x="675" y="250" width="225" height="185" rx="15" fill="#51697d" stroke="#7de2d1"/>
  <text x="715" y="292" font-size="23" font-weight="700">topk_tree8</text><text x="705" y="327" font-size="17">4 × topk_pair</text><text x="705" y="357" font-size="17">2 × topk_merge</text><text x="705" y="387" font-size="17">1 × root merge</text><text x="705" y="417" font-size="17">1-cycle result register</text>
  <rect x="980" y="270" width="235" height="150" rx="15" fill="#51697d" stroke="#7de2d1"/>
  <text x="1012" y="320" font-size="23" font-weight="700">DMA writeback</text><text x="1010" y="355" font-size="17">top0 {index,value}</text><text x="1010" y="385" font-size="17">top1 {index,value}</text>
  <rect x="675" y="55" width="225" height="115" rx="15" fill="#51697d" stroke="#ffd166"/>
  <text x="712" y="100" font-size="22" font-weight="700">topk_irq_latch</text><text x="710" y="135" font-size="17">sticky, W1C pending</text>
  <rect x="1245" y="220" width="120" height="235" rx="15" fill="#5b6f82" stroke="#a8dadc"/>
  <text x="1275" y="265" font-size="22" font-weight="700">RAM</text><text x="1263" y="305" font-size="16">logits</text><text x="1263" y="335" font-size="16">results</text>
  <path d="M260 265 L335 145" fill="none" stroke="#ffd166" marker-end="url(#ctrl)"/><text x="225" y="175" font-size="15" fill="#ffd166">control</text>
  <path d="M600 345 L675 345" fill="none" stroke="#7de2d1" marker-end="url(#arrow)"/>
  <path d="M900 345 L980 345" fill="none" stroke="#7de2d1" marker-end="url(#arrow)"/>
  <path d="M1245 305 L600 305" fill="none" stroke="#7de2d1" marker-end="url(#arrow)"/><text x="980" y="292" font-size="15" fill="#7de2d1">mem_rd_valid/ready/addr/data</text>
  <path d="M1215 390 L1245 390" fill="none" stroke="#7de2d1" marker-end="url(#arrow)"/><text x="980" y="455" font-size="15" fill="#7de2d1">mem_wr_valid/ready/addr/data</text>
  <path d="M600 115 L675 115" fill="none" stroke="#ffd166" marker-end="url(#ctrl)"/><text x="610" y="100" font-size="15" fill="#ffd166">done</text>
  <path d="M675 90 L260 235" fill="none" stroke="#ffd166" marker-end="url(#ctrl)"/><text x="450" y="205" font-size="18" fill="#ffd166">irq</text>
 </g>
 <g font-family="Arial,sans-serif" font-size="18"><line x1="65" y1="560" x2="145" y2="560" stroke="#7de2d1" stroke-width="5"/><text x="160" y="566" fill="#fff">data path</text><line x1="350" y1="560" x2="430" y2="560" stroke="#ffd166" stroke-width="5"/><text x="445" y="566" fill="#fff">control / interrupt</text></g>
</svg>
