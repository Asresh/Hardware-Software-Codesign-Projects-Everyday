<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" width="1400" height="680" role="img" aria-labelledby="title desc">
  <title id="title">HID Touch Fusion Engine block diagram</title>
  <desc id="desc">Host driver sends sensor frames through a real SPI bus into the command controller, preprocessing reduction, and dual divider datapath. Results and an interrupt return to the host.</desc>
  <defs>
    <marker id="data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#22d3ee"/></marker>
    <marker id="ctrl" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1400" height="680" fill="#475569"/>
  <text x="700" y="46" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="700">Day 22: SPI HID Touch/Force Fusion Datapath</text>

  <rect x="45" y="115" width="220" height="180" rx="14" fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
  <text x="155" y="155" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="23" font-weight="700">CPU / HID Driver</text>
  <text x="155" y="190" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="16">configure()</text>
  <text x="155" y="220" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="16">submit(frame)</text>
  <text x="155" y="250" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="16">ISR + read_result()</text>

  <rect x="345" y="105" width="230" height="200" rx="14" fill="#1e3a5f" stroke="#67e8f9" stroke-width="3"/>
  <text x="460" y="145" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">hidf_spi_phy</text>
  <text x="460" y="180" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="15">8-bit RX shift reg</text>
  <text x="460" y="207" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="15">8-bit TX shift reg</text>
  <text x="460" y="244" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">mode 0 oversampling</text>
  <text x="460" y="272" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">no hidden FIFO</text>

  <rect x="660" y="105" width="255" height="200" rx="14" fill="#1e3a5f" stroke="#fbbf24" stroke-width="3"/>
  <text x="787" y="145" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">hidf_top controller</text>
  <text x="787" y="180" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="15">CONFIG / FRAME</text>
  <text x="787" y="207" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="15">STATUS / RESULT</text>
  <text x="787" y="244" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">8 × 16-bit frame buffer</text>
  <text x="787" y="272" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">sticky result + IRQ</text>

  <rect x="555" y="405" width="270" height="180" rx="14" fill="#14532d" stroke="#86efac" stroke-width="3"/>
  <text x="690" y="445" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">hidf_preprocess</text>
  <text x="690" y="480" text-anchor="middle" fill="#bbf7d0" font-family="monospace" font-size="15">8 baseline clamps</text>
  <text x="690" y="510" text-anchor="middle" fill="#bbf7d0" font-family="monospace" font-size="15">total / right / bottom</text>
  <text x="690" y="544" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">parallel reduction datapath</text>

  <rect x="935" y="395" width="250" height="200" rx="14" fill="#14532d" stroke="#86efac" stroke-width="3"/>
  <text x="1060" y="435" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">hidf_fusion_core</text>
  <text x="1060" y="470" text-anchor="middle" fill="#bbf7d0" font-family="monospace" font-size="15">2 × hidf_udiv(32)</text>
  <text x="1060" y="500" text-anchor="middle" fill="#bbf7d0" font-family="monospace" font-size="15">x,y in parallel</text>
  <text x="1060" y="534" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">32 iterations, no DSP</text>
  <text x="1060" y="562" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">touch threshold gate</text>

  <path d="M265 155 L345 155" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#data)"/>
  <text x="305" y="137" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="13">spi_mosi</text>
  <path d="M345 220 L265 220" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#data)"/>
  <text x="305" y="247" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="13">spi_miso</text>
  <path d="M265 278 L345 278" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ctrl)"/>
  <text x="305" y="300" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="12">spi_sclk, spi_cs_n</text>
  <path d="M575 205 L660 205" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#data)"/>
  <text x="617" y="188" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="13">rx_byte[7:0]</text>
  <path d="M760 305 L710 405" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#data)"/>
  <text x="700" y="360" text-anchor="end" fill="#e0f2fe" font-family="monospace" font-size="13">samples[127:0]</text>
  <path d="M825 495 L935 495" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#data)"/>
  <text x="880" y="477" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="13">3 × sum[19:0]</text>
  <path d="M1060 395 L880 305" fill="none" stroke="#22d3ee" stroke-width="5" marker-end="url(#data)"/>
  <text x="1015" y="337" fill="#e0f2fe" font-family="monospace" font-size="13">x,y,pressure</text>
  <path d="M660 275 L575 275" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ctrl)"/>
  <text x="618" y="298" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="13">tx_load</text>
  <path d="M660 125 C510 60 210 60 155 115" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#ctrl)"/>
  <text x="420" y="76" text-anchor="middle" fill="#fef3c7" font-family="monospace" font-size="15">irq (completion)</text>
  <rect x="45" y="620" width="20" height="8" fill="#22d3ee"/><text x="75" y="630" fill="#f8fafc" font-family="sans-serif" font-size="14">datapath</text>
  <line x1="165" y1="624" x2="195" y2="624" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6"/><text x="205" y="630" fill="#f8fafc" font-family="sans-serif" font-size="14">control</text>
</svg>
