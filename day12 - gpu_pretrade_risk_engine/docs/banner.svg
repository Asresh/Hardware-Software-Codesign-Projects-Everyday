<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <rect x="0" y="0" width="1000" height="260" fill="#243447"/>
  <rect x="0" y="0" width="1000" height="8" fill="#4fd1a5"/>
  <rect x="0" y="252" width="1000" height="8" fill="#e0567a"/>

  <!-- day badge -->
  <rect x="40" y="60" width="150" height="140" rx="12" fill="#1b2735" stroke="#4fd1a5" stroke-width="3"/>
  <text x="115" y="118" font-family="Menlo,monospace" font-size="30" fill="#8aa0b6" text-anchor="middle">DAY</text>
  <text x="115" y="180" font-family="Menlo,monospace" font-size="72" font-weight="bold" fill="#4fd1a5" text-anchor="middle">12</text>

  <!-- title -->
  <text x="230" y="112" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="bold" fill="#f2f6fa">Pre-Trade Risk Engine</text>
  <text x="232" y="152" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#c6d3df">Line-rate market-access gateway &#183; SEC 15c3-5 style</text>

  <!-- feature chips -->
  <rect x="232" y="180" width="196" height="40" rx="20" fill="#1b2735" stroke="#5b7089" stroke-width="1.5"/>
  <text x="330" y="206" font-family="Menlo,monospace" font-size="17" fill="#9fe8cf" text-anchor="middle">6 parallel risk gates</text>
  <rect x="440" y="180" width="176" height="40" rx="20" fill="#1b2735" stroke="#5b7089" stroke-width="1.5"/>
  <text x="528" y="206" font-family="Menlo,monospace" font-size="17" fill="#9fe8cf" text-anchor="middle">1 order / clock</text>
  <rect x="628" y="180" width="150" height="40" rx="20" fill="#1b2735" stroke="#5b7089" stroke-width="1.5"/>
  <text x="703" y="206" font-family="Menlo,monospace" font-size="17" fill="#9fe8cf" text-anchor="middle">2-cyc latency</text>
  <rect x="790" y="180" width="170" height="40" rx="20" fill="#1b2735" stroke="#5b7089" stroke-width="1.5"/>
  <text x="875" y="206" font-family="Menlo,monospace" font-size="17" fill="#f3b3c4" text-anchor="middle">AXIS + APB</text>

  <!-- decorative verdict lane -->
  <g font-family="Menlo,monospace" font-size="15" fill="#f2f6fa">
    <rect x="812" y="66" width="150" height="30" rx="6" fill="#2f6b52"/>
    <text x="887" y="87" text-anchor="middle" fill="#d6ffe9">ACCEPT</text>
    <rect x="812" y="104" width="150" height="30" rx="6" fill="#8a2f46"/>
    <text x="887" y="125" text-anchor="middle" fill="#ffd9e2">REJECT + reason</text>
  </g>
</svg>
