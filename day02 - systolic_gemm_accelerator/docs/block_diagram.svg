<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760" font-family="Helvetica, Arial, sans-serif">
  <!-- opaque background so the diagram is legible in both GitHub themes -->
  <rect x="0" y="0" width="1160" height="760" fill="#eef2f7" stroke="#c7d1dd" stroke-width="2"/>
  <text x="24" y="34" font-size="22" font-weight="bold" fill="#1b2733">Day 2 — Systolic GEMM Accelerator: block diagram</text>

  <!-- ===================== legend ===================== -->
  <g transform="translate(760,44)">
    <rect x="0" y="0" width="376" height="70" rx="8" fill="#ffffff" stroke="#c7d1dd" stroke-width="1"/>
    <text x="14" y="22" font-size="13" font-weight="bold" fill="#33414f">Legend</text>
    <line x1="16" y1="40" x2="60" y2="40" stroke="#1f8a8a" stroke-width="4"/>
    <polygon points="60,34 74,40 60,46" fill="#1f8a8a"/>
    <text x="82" y="44" font-size="13" fill="#33414f">operand / result datapath</text>
    <line x1="220" y1="40" x2="264" y2="40" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
    <polygon points="264,34 278,40 264,46" fill="#c9862b"/>
    <text x="286" y="44" font-size="13" fill="#33414f">control / status</text>
  </g>

  <!-- ===================== host ===================== -->
  <rect x="60" y="56" width="300" height="52" rx="8" fill="#cfe0f0" stroke="#4a6fa5" stroke-width="2"/>
  <text x="210" y="80" font-size="17" font-weight="bold" fill="#1b2733" text-anchor="middle">Host CPU  (firmware driver, sw/)</text>
  <text x="210" y="99" font-size="12" fill="#43566a" text-anchor="middle">loads A/B · sets K,MODE · START · waits IRQ · reads C</text>

  <!-- ===================== Wishbone bus ===================== -->
  <rect x="60" y="132" width="1040" height="34" rx="4" fill="#d9c39a" stroke="#b48a3f" stroke-width="2"/>
  <text x="70" y="154" font-size="13" font-weight="bold" fill="#4a3410">Wishbone B4 classic bus</text>
  <text x="1090" y="154" font-size="12" fill="#4a3410" text-anchor="end">ADR[15:0] · DAT_I/DAT_O[31:0] · SEL[3:0] · WE · STB · CYC · ACK</text>
  <!-- host <-> bus -->
  <line x1="210" y1="108" x2="210" y2="132" stroke="#1f8a8a" stroke-width="4"/>
  <polygon points="204,132 216,132 210,140" fill="#1f8a8a"/>

  <!-- ===================== wb_slave ===================== -->
  <rect x="60" y="210" width="300" height="150" rx="8" fill="#cfe7e3" stroke="#2f8a8a" stroke-width="2"/>
  <text x="210" y="234" font-size="16" font-weight="bold" fill="#12433f" text-anchor="middle">wb_slave.v</text>
  <text x="210" y="254" font-size="12" fill="#1c5b56" text-anchor="middle">Wishbone slave · address decode</text>
  <text x="76" y="280" font-size="11.5" fill="#33414f">CTRL / STATUS / KLEN / MODE</text>
  <text x="76" y="298" font-size="11.5" fill="#33414f">N_DIM / DATA_W / KMAX / CYCLES</text>
  <text x="76" y="322" font-size="11.5" fill="#33414f">decode: 0x1xxx→A  0x2xxx→B  0x3xxx→C</text>
  <text x="76" y="344" font-size="11.5" fill="#33414f">registered single-cycle ACK</text>
  <!-- bus <-> wb_slave -->
  <line x1="210" y1="166" x2="210" y2="210" stroke="#1f8a8a" stroke-width="4"/>
  <polygon points="204,210 216,210 210,218" fill="#1f8a8a"/>

  <!-- ===================== operand buffers ===================== -->
  <rect x="410" y="210" width="180" height="86" rx="8" fill="#e5dcc3" stroke="#b48a3f" stroke-width="2"/>
  <text x="500" y="234" font-size="14" font-weight="bold" fill="#4a3410" text-anchor="middle">A^T buffer</text>
  <text x="500" y="253" font-size="11.5" fill="#5c4a24" text-anchor="middle">column-major</text>
  <text x="500" y="271" font-size="11.5" fill="#5c4a24" text-anchor="middle">8 x 64 bytes</text>
  <text x="500" y="289" font-size="11" fill="#7a6636" text-anchor="middle">a_buf[k*N+i]=A[i][k]</text>

  <rect x="610" y="210" width="180" height="86" rx="8" fill="#e5dcc3" stroke="#b48a3f" stroke-width="2"/>
  <text x="700" y="234" font-size="14" font-weight="bold" fill="#4a3410" text-anchor="middle">B buffer</text>
  <text x="700" y="253" font-size="11.5" fill="#5c4a24" text-anchor="middle">row-major</text>
  <text x="700" y="271" font-size="11.5" fill="#5c4a24" text-anchor="middle">64 x 8 bytes</text>
  <text x="700" y="289" font-size="11" fill="#7a6636" text-anchor="middle">b_buf[k*N+j]=B[k][j]</text>

  <!-- wb_slave -> buffers (datapath: buffer writes) -->
  <line x1="360" y1="250" x2="410" y2="250" stroke="#1f8a8a" stroke-width="4"/>
  <polygon points="410,244 410,256 418,250" fill="#1f8a8a"/>
  <text x="366" y="242" font-size="10.5" fill="#12433f">a_we/b_we, buf_wdata</text>

  <!-- ===================== completion FSM ===================== -->
  <rect x="840" y="210" width="260" height="86" rx="8" fill="#e6d6e0" stroke="#8a5a7a" stroke-width="2"/>
  <text x="970" y="234" font-size="15" font-weight="bold" fill="#5a2f4a" text-anchor="middle">completion FSM</text>
  <text x="970" y="254" font-size="11.5" fill="#6a3a58" text-anchor="middle">START→DONE cycle counter</text>
  <text x="970" y="272" font-size="11.5" fill="#6a3a58" text-anchor="middle">DONE / BUSY / CYCLES latch</text>
  <text x="970" y="290" font-size="11.5" fill="#6a3a58" text-anchor="middle">irq = DONE &amp; IRQ_EN</text>
  <!-- wb_slave <-> completion : start pulse + status (control) -->
  <line x1="360" y1="330" x2="820" y2="330" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="820" y1="330" x2="820" y2="296" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="814,296 826,296 820,288" fill="#c9862b"/>
  <text x="470" y="324" font-size="10.5" fill="#8a5a2b">start_pulse / irq_clr  ·  done,busy,cycles (status)</text>
  <!-- irq out to host -->
  <line x1="1100" y1="240" x2="1132" y2="240" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="1132" y1="240" x2="1132" y2="82" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="1132" y1="82" x2="360" y2="82" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="360,76 360,88 352,82" fill="#c9862b"/>
  <text x="1000" y="150" font-size="12" font-weight="bold" fill="#8a5a2b">irq</text>

  <!-- ===================== gemm_feeder ===================== -->
  <rect x="60" y="440" width="300" height="150" rx="8" fill="#cfe7e3" stroke="#2f8a8a" stroke-width="2"/>
  <text x="210" y="464" font-size="16" font-weight="bold" fill="#12433f" text-anchor="middle">gemm_feeder.v</text>
  <text x="210" y="484" font-size="12" fill="#1c5b56" text-anchor="middle">sequencer + input-skew network</text>
  <text x="76" y="510" font-size="11.5" fill="#33414f">walks k = 0..K-1, reads A col / B row</text>
  <text x="76" y="530" font-size="11.5" fill="#33414f">A skew: row i delayed i cycles</text>
  <text x="76" y="550" font-size="11.5" fill="#33414f">B skew: col j delayed j cycles</text>
  <text x="76" y="570" font-size="11.5" fill="#33414f">drives en/clr · TC = K + 2N cycles</text>
  <!-- wb_slave -> feeder (control: start,klen,accum) -->
  <line x1="150" y1="360" x2="150" y2="440" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="144,440 156,440 150,448" fill="#c9862b"/>
  <text x="158" y="404" font-size="10.5" fill="#8a5a2b">start, klen, accum_mode</text>

  <!-- buffers -> feeder (datapath read: a_col / b_row) -->
  <line x1="500" y1="296" x2="500" y2="410" stroke="#1f8a8a" stroke-width="4"/>
  <line x1="500" y1="410" x2="330" y2="410" stroke="#1f8a8a" stroke-width="4"/>
  <line x1="330" y1="410" x2="330" y2="440" stroke="#1f8a8a" stroke-width="4"/>
  <polygon points="324,440 336,440 330,448" fill="#1f8a8a"/>
  <line x1="700" y1="296" x2="700" y2="410" stroke="#1f8a8a" stroke-width="4"/>
  <line x1="700" y1="410" x2="500" y2="410" stroke="#1f8a8a" stroke-width="4"/>
  <text x="405" y="428" font-size="10.5" fill="#12433f" text-anchor="end">rd_k → a_col[8], b_row[8]</text>

  <!-- ===================== systolic array ===================== -->
  <rect x="410" y="360" width="690" height="360" rx="8" fill="#dfeecb" stroke="#6a9a3a" stroke-width="2"/>
  <text x="755" y="386" font-size="16" font-weight="bold" fill="#33520f" text-anchor="middle">systolic_array.v — 8 x 8 output-stationary PEs (pe.v)</text>
  <text x="755" y="405" font-size="12" fill="#47660f" text-anchor="middle">each PE: acc += a_in*b_in ; a→right, b→down (1 cycle/hop) ; accumulators ARE the C tile</text>

  <!-- PE grid 8x8 -->
  <g transform="translate(560,420)">
    <!-- draw 64 cells procedurally-looking; 26px pitch, 20px cell -->
    <!-- row lines to keep it compact: use rects -->
    <!-- generated grid -->
    <!-- r0 --><rect x="0" y="0" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/><rect x="26" y="0" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="52" y="0" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="78" y="0" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="104" y="0" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="130" y="0" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="156" y="0" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="182" y="0" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/>
    <!-- r1 --><rect x="0" y="26" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="26" y="26" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/><rect x="52" y="26" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="78" y="26" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="104" y="26" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="130" y="26" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="156" y="26" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="182" y="26" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/>
    <!-- r2 --><rect x="0" y="52" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="26" y="52" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="52" y="52" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/><rect x="78" y="52" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="104" y="52" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="130" y="52" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="156" y="52" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="182" y="52" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/>
    <!-- r3 --><rect x="0" y="78" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="26" y="78" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="52" y="78" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="78" y="78" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/><rect x="104" y="78" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="130" y="78" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="156" y="78" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="182" y="78" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/>
    <!-- r4 --><rect x="0" y="104" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="26" y="104" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="52" y="104" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="78" y="104" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="104" y="104" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/><rect x="130" y="104" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="156" y="104" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="182" y="104" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/>
    <!-- r5 --><rect x="0" y="130" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="26" y="130" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="52" y="130" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="78" y="130" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="104" y="130" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="130" y="130" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/><rect x="156" y="130" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="182" y="130" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/>
    <!-- r6 --><rect x="0" y="156" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="26" y="156" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="52" y="156" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="78" y="156" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="104" y="156" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="130" y="156" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="156" y="156" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/><rect x="182" y="156" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/>
    <!-- r7 --><rect x="0" y="182" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="26" y="182" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="52" y="182" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="78" y="182" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="104" y="182" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="130" y="182" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="156" y="182" width="20" height="20" rx="2" fill="#b7d98c" stroke="#5f8a2f"/><rect x="182" y="182" width="20" height="20" rx="2" fill="#9ec96a" stroke="#5f8a2f"/>
  </g>

  <!-- feeder -> array : a_left (rows), en/clr (control) -->
  <line x1="360" y1="500" x2="540" y2="500" stroke="#1f8a8a" stroke-width="4"/>
  <polygon points="540,494 540,506 548,500 " fill="#1f8a8a"/>
  <text x="374" y="493" font-size="11" fill="#12433f">a_left[8]  (skewed A rows →)</text>
  <line x1="360" y1="560" x2="540" y2="560" stroke="#c9862b" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="540,554 540,566 548,560" fill="#c9862b"/>
  <text x="392" y="553" font-size="11" fill="#8a5a2b">en, clr</text>

  <!-- b_top into the array top edge (datapath) -->
  <line x1="661" y1="410" x2="661" y2="418" stroke="#1f8a8a" stroke-width="4"/>
  <polygon points="655,418 667,418 661,426" fill="#1f8a8a"/>
  <text x="675" y="416" font-size="11" fill="#12433f">b_top[8]  (skewed B cols ↓)</text>

  <!-- array acc -> wb_slave (C read datapath) -->
  <line x1="1080" y1="540" x2="1120" y2="540" stroke="#1f8a8a" stroke-width="4"/>
  <line x1="1120" y1="540" x2="1120" y2="650" stroke="#1f8a8a" stroke-width="4"/>
  <line x1="1120" y1="650" x2="30" y2="650" stroke="#1f8a8a" stroke-width="4"/>
  <line x1="30" y1="650" x2="30" y2="285" stroke="#1f8a8a" stroke-width="4"/>
  <line x1="30" y1="285" x2="60" y2="285" stroke="#1f8a8a" stroke-width="4"/>
  <polygon points="60,279 60,291 68,285" fill="#1f8a8a"/>
  <text x="540" y="695" font-size="11" fill="#12433f" text-anchor="middle">C[i][j] read back through wb_slave → Wishbone (c_rdata = acc_flat[i*N+j])</text>

  <text x="24" y="738" font-size="12" fill="#5b6b7b">Data plane (teal): 32-bit Wishbone words pack 4 operand bytes; the array streams 64 MAC/cycle at steady state. Control plane (amber): one START per tile, DONE/irq on completion.</text>
</svg>
