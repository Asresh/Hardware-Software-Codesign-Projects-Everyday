<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720">
  <defs>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#63b3ed"/>
    </marker>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f6ad55"/>
    </marker>
    <marker id="ai" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fc8181"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="720" fill="#26313f"/>
  <text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Day 14 &#8212; All-Reduce Collective Engine &#8212; block diagram</text>

  <!-- ===================== Host CPU ===================== -->
  <rect x="40" y="70" width="250" height="86" rx="10" fill="#1b2735" stroke="#63b3ed" stroke-width="2"/>
  <text x="165" y="104" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Host CPU / GPU driver</text>
  <text x="165" y="130" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">builds descriptor ring,</text>
  <text x="165" y="147" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#9fb3c8" text-anchor="middle">programs MMIO, takes IRQ</text>

  <!-- ===================== Shared memory ===================== -->
  <rect x="40" y="330" width="250" height="320" rx="10" fill="#1b2735" stroke="#68d391" stroke-width="2"/>
  <text x="165" y="358" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Shared memory</text>
  <rect x="60" y="374" width="210" height="70" rx="6" fill="#22303f" stroke="#68d391" stroke-width="1.5"/>
  <text x="165" y="399" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e0" text-anchor="middle">descriptor ring</text>
  <text x="165" y="418" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">{op, n, dst, src[0..R-1]}</text>
  <text x="165" y="434" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">16 words / descriptor</text>
  <rect x="60" y="454" width="210" height="96" rx="6" fill="#22303f" stroke="#68d391" stroke-width="1.5"/>
  <text x="165" y="478" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e0" text-anchor="middle">R rank source buffers</text>
  <text x="165" y="497" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">rank 0 &#8230; rank R-1</text>
  <text x="165" y="516" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">int32[n] each</text>
  <text x="165" y="536" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">(one per GPU peer)</text>
  <rect x="60" y="560" width="210" height="72" rx="6" fill="#22303f" stroke="#68d391" stroke-width="1.5"/>
  <text x="165" y="585" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#cbd5e0" text-anchor="middle">destination buffer</text>
  <text x="165" y="604" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">reduced int32[n]</text>
  <text x="165" y="623" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">(broadcast result)</text>

  <!-- ===================== Engine outer ===================== -->
  <rect x="360" y="70" width="640" height="600" rx="12" fill="#2d3a4b" stroke="#a0aec0" stroke-width="2"/>
  <text x="380" y="96" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">arc_collective_top</text>

  <!-- regfile -->
  <rect x="390" y="112" width="250" height="96" rx="8" fill="#1b2735" stroke="#f6ad55" stroke-width="2"/>
  <text x="515" y="140" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">arc_regfile</text>
  <text x="515" y="161" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">MMIO CTRL/STATUS/DESC_BASE</text>
  <text x="515" y="177" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">DESC_COUNT / COMPLETED / GROUPS</text>
  <text x="515" y="193" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">sticky done/err IRQ (W1C)</text>

  <!-- dma engine -->
  <rect x="390" y="250" width="250" height="200" rx="8" fill="#1b2735" stroke="#63b3ed" stroke-width="2"/>
  <text x="515" y="278" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">arc_dma_engine</text>
  <text x="515" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">descriptor fetch FSM</text>
  <text x="515" y="317" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">group address generator</text>
  <text x="515" y="334" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">R-way gather / P-wide scatter</text>
  <rect x="410" y="348" width="210" height="44" rx="6" fill="#22303f" stroke="#63b3ed" stroke-width="1.5"/>
  <text x="515" y="368" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#cbd5e0" text-anchor="middle">write-delay pipeline</text>
  <text x="515" y="384" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">depth R (addr + mask)</text>
  <text x="515" y="418" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">counters: completed / groups / words</text>
  <text x="515" y="436" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">adv = mem_ready (lossless stall)</text>

  <!-- reduce array -->
  <rect x="700" y="250" width="270" height="380" rx="8" fill="#1b2735" stroke="#4fd1c5" stroke-width="2"/>
  <text x="835" y="278" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">arc_reduce_array</text>
  <text x="835" y="298" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">R-stage &#215; P-lane systolic</text>
  <text x="835" y="314" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">skew: rank r delayed r cycles</text>
  <!-- PE grid 4x4 -->
  <g>
    <!-- rows = ranks/stages, cols = lanes -->
    <g fill="#22303f" stroke="#4fd1c5" stroke-width="1.5">
      <rect x="722" y="330" width="46" height="40" rx="4"/><rect x="778" y="330" width="46" height="40" rx="4"/><rect x="834" y="330" width="46" height="40" rx="4"/><rect x="890" y="330" width="46" height="40" rx="4"/>
      <rect x="722" y="380" width="46" height="40" rx="4"/><rect x="778" y="380" width="46" height="40" rx="4"/><rect x="834" y="380" width="46" height="40" rx="4"/><rect x="890" y="380" width="46" height="40" rx="4"/>
      <rect x="722" y="430" width="46" height="40" rx="4"/><rect x="778" y="430" width="46" height="40" rx="4"/><rect x="834" y="430" width="46" height="40" rx="4"/><rect x="890" y="430" width="46" height="40" rx="4"/>
      <rect x="722" y="480" width="46" height="40" rx="4"/><rect x="778" y="480" width="46" height="40" rx="4"/><rect x="834" y="480" width="46" height="40" rx="4"/><rect x="890" y="480" width="46" height="40" rx="4"/>
    </g>
    <text x="745" y="355" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#cbd5e0" text-anchor="middle">PE</text>
    <text x="835" y="545" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">arc_reduce_pe: SUM/PROD/MAX/MIN</text>
    <text x="835" y="563" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9fb3c8" text-anchor="middle">exact two's-complement</text>
  </g>
  <text x="757" y="326" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#718096" text-anchor="middle">&#8592; P lanes &#8594;</text>
  <text x="835" y="600" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4fd1c5" text-anchor="middle" font-weight="bold">latency = R cycles, then 1 group/clk</text>

  <!-- ===================== Arrows ===================== -->
  <!-- MMIO control: CPU <-> regfile -->
  <line x1="290" y1="113" x2="388" y2="140" stroke="#f6ad55" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <text x="300" y="104" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#f6ad55">reg_wr/rd, reg_addr[7:0],</text>
  <text x="300" y="119" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#f6ad55">reg_wdata/rdata[31:0]</text>

  <!-- regfile -> dma control -->
  <line x1="515" y1="208" x2="515" y2="248" stroke="#f6ad55" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <text x="525" y="234" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#f6ad55">start, soft_reset, desc_base/count</text>

  <!-- descriptor read: dma <-> mem (datapath) -->
  <line x1="390" y1="285" x2="292" y2="400" stroke="#63b3ed" stroke-width="2" marker-end="url(#ad)"/>
  <text x="150" y="300" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#63b3ed">desc_rd_addr / desc_rd_data[16&#215;32]</text>

  <!-- source gather: mem -> dma (datapath, wide) -->
  <line x1="292" y1="500" x2="390" y2="360" stroke="#63b3ed" stroke-width="3.5" marker-end="url(#ad)"/>
  <text x="150" y="560" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#63b3ed">src_rd_addr[R&#215;24] / src_rd_data[R&#183;P&#183;32]</text>

  <!-- result scatter: dma -> mem (datapath) -->
  <line x1="392" y1="405" x2="292" y2="600" stroke="#63b3ed" stroke-width="2.5" marker-end="url(#ad)"/>
  <text x="150" y="642" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#63b3ed">res_wr_addr / mask[P] / data[P&#183;32]</text>

  <!-- dma -> array in (datapath) -->
  <line x1="640" y1="340" x2="698" y2="340" stroke="#63b3ed" stroke-width="3.5" marker-end="url(#ad)"/>
  <text x="648" y="332" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#63b3ed">arr_in_data</text>
  <text x="648" y="356" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#63b3ed">[R&#183;P&#183;32]</text>
  <!-- dma -> array control -->
  <line x1="640" y1="300" x2="698" y2="300" stroke="#f6ad55" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <text x="644" y="294" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#f6ad55">arr_op, adv</text>
  <!-- array -> dma out (datapath) -->
  <line x1="698" y1="470" x2="640" y2="430" stroke="#63b3ed" stroke-width="2.5" marker-end="url(#ad)"/>
  <text x="642" y="462" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#63b3ed">arr_out_data[P&#183;32]</text>

  <!-- mem_ready stall into dma -->
  <line x1="360" y1="430" x2="388" y2="430" stroke="#f6ad55" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <text x="300" y="466" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#f6ad55">mem_ready (wait-state stall)</text>

  <!-- IRQ regfile -> CPU -->
  <line x1="388" y1="176" x2="166" y2="176" stroke="#fc8181" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="166" y1="176" x2="166" y2="158" stroke="#fc8181" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ai)"/>
  <text x="196" y="196" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#fc8181">irq (done / over-cap error)</text>

  <!-- ===================== Legend ===================== -->
  <rect x="700" y="656" width="300" height="20" fill="none"/>
  <line x1="708" y1="666" x2="740" y2="666" stroke="#63b3ed" stroke-width="3"/>
  <text x="746" y="670" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#cbd5e0">datapath</text>
  <line x1="828" y1="666" x2="860" y2="666" stroke="#f6ad55" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="866" y="670" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#cbd5e0">control</text>
  <line x1="928" y1="666" x2="958" y2="666" stroke="#fc8181" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="964" y="670" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#cbd5e0">IRQ</text>
</svg>
