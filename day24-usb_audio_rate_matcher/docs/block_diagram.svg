<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" width="1400" height="650">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#38bdf8"/></marker><marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#f59e0b"/></marker></defs>
<rect width="1400" height="650" fill="#475569"/>
<text x="700" y="42" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">USB Audio Clock-Domain Rate Matcher</text>
<rect x="45" y="100" width="220" height="150" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/><text x="155" y="145" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="23">CPU / USB Driver</text><text x="155" y="180" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="15">target, gain, enable</text><text x="155" y="210" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="15">count, IRQ W1C</text>
<rect x="350" y="85" width="250" height="180" rx="12" fill="#334155" stroke="#f59e0b" stroke-width="3"/><text x="475" y="125" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="21">usb_audio_mmio_regs</text><text x="475" y="158" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="14">bus_valid_i</text><text x="475" y="180" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="14">bus_write_i, bus_addr_i</text><text x="475" y="202" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="14">bus_wdata_i/rdata_o</text><text x="475" y="232" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">sticky completion IRQ</text>
<line x1="265" y1="145" x2="348" y2="145" stroke="#f59e0b" stroke-width="4" marker-end="url(#c)"/><line x1="350" y1="215" x2="267" y2="215" stroke="#f59e0b" stroke-width="4" marker-end="url(#c)"/>
<rect x="45" y="360" width="220" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="155" y="405" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="22">USB Endpoint FIFO</text><text x="155" y="440" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="14">s_prev_i / s_curr_i</text><text x="155" y="465" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="14">s_fill_i / s_last_i</text><text x="155" y="490" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="14">ready / valid</text>
<rect x="350" y="350" width="210" height="170" rx="12" fill="#0f766e" stroke="#5eead4" stroke-width="3"/><text x="455" y="395" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20">fill_error</text><text x="455" y="430" text-anchor="middle" fill="#ccfbf1" font-family="sans-serif" font-size="15">target − occupancy</text><text x="455" y="472" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">elastic stage 0</text>
<rect x="630" y="350" width="240" height="170" rx="12" fill="#0f766e" stroke="#5eead4" stroke-width="3"/><text x="750" y="395" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20">pi_rate_controller</text><text x="750" y="430" text-anchor="middle" fill="#ccfbf1" font-family="sans-serif" font-size="15">Q8 multiply + clamp</text><text x="750" y="472" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">elastic stage 1</text>
<rect x="940" y="350" width="240" height="170" rx="12" fill="#0f766e" stroke="#5eead4" stroke-width="3"/><text x="1060" y="395" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20">linear_interpolator</text><text x="1060" y="430" text-anchor="middle" fill="#ccfbf1" font-family="sans-serif" font-size="15">PCM16 blend + saturate</text><text x="1060" y="472" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">elastic stage 2</text>
<rect x="1240" y="360" width="125" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="1302" y="415" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20">Codec</text><text x="1302" y="450" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="13">m_sample_o</text><text x="1302" y="477" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="13">m_last_o</text>
<line x1="265" y1="435" x2="348" y2="435" stroke="#38bdf8" stroke-width="5" marker-end="url(#a)"/><line x1="560" y1="435" x2="628" y2="435" stroke="#38bdf8" stroke-width="5" marker-end="url(#a)"/><line x1="870" y1="435" x2="938" y2="435" stroke="#38bdf8" stroke-width="5" marker-end="url(#a)"/><line x1="1180" y1="435" x2="1238" y2="435" stroke="#38bdf8" stroke-width="5" marker-end="url(#a)"/>
<path d="M475 265 V310 H750 V348" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#c)"/><text x="590" y="302" fill="#fde68a" font-family="sans-serif" font-size="15">target_fill, gain_q8, enable</text>
<path d="M1180 505 V575 H155 V252" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#c)"/><text x="650" y="604" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="16">completion interrupt after frame-last retires</text>
<text x="50" y="630" fill="#bae6fd" font-family="sans-serif" font-size="15">solid blue: PCM datapath</text><text x="1170" y="630" fill="#fde68a" font-family="sans-serif" font-size="15">dashed amber: control / IRQ</text>
</svg>
