<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 820" width="1260" height="820">
  <!-- opaque mid-tone background so the diagram reads on light and dark themes -->
  <rect x="0" y="0" width="1260" height="820" fill="#33415a"/>

  <text x="30" y="42" font-family="Verdana,Geneva,sans-serif" font-size="26" font-weight="bold" fill="#f8fafc">Day 4 &#8212; Tiled Bitonic Sort Accelerator: host / bus / datapath</text>

  <!-- ============================ HOST CPU ============================ -->
  <rect x="40" y="330" width="180" height="150" rx="10" fill="#e2e8f0" stroke="#0ea5e9" stroke-width="3"/>
  <text x="130" y="398" font-family="Verdana,Geneva,sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">HOST CPU</text>
  <text x="130" y="424" font-family="Verdana,Geneva,sans-serif" font-size="14" fill="#334155" text-anchor="middle">sort_driver.c</text>
  <text x="130" y="446" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#475569" text-anchor="middle">program + poll,</text>
  <text x="130" y="463" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#475569" text-anchor="middle">no key touched</text>

  <!-- ======================= sort_top container ======================= -->
  <rect x="300" y="80" width="740" height="470" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="318" y="108" font-family="Verdana,Geneva,sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">sort_top.v</text>

  <!-- CSR / MMIO control plane -->
  <rect x="330" y="130" width="270" height="150" rx="8" fill="#e2e8f0" stroke="#0ea5e9" stroke-width="3"/>
  <text x="465" y="162" font-family="Verdana,Geneva,sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">MMIO CSR</text>
  <text x="465" y="185" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#334155" text-anchor="middle">control plane</text>
  <text x="465" y="212" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">IDENT / CTRL / STATUS</text>
  <text x="465" y="230" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">SRC / DST / NTILES / MODE</text>
  <text x="465" y="248" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">CYCLES (measured latency)</text>
  <text x="465" y="269" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">IDENT = 0x5B17_0004</text>

  <!-- sort_ctrl -->
  <rect x="330" y="340" width="270" height="180" rx="8" fill="#e2e8f0" stroke="#22c55e" stroke-width="3"/>
  <text x="465" y="372" font-family="Verdana,Geneva,sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">sort_ctrl.v</text>
  <text x="465" y="395" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#334155" text-anchor="middle">descriptor + wide-DMA</text>
  <text x="465" y="413" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#334155" text-anchor="middle">address generator</text>
  <text x="465" y="440" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">read beat &#8594; net &#8594; write beat</text>
  <text x="465" y="458" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">1 tile / clock, in order</text>
  <text x="465" y="482" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">START&#8594;DONE cycle counter</text>
  <text x="465" y="504" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">rd_idx / wr_idx retire</text>

  <!-- bitonic_network -->
  <rect x="660" y="180" width="350" height="300" rx="8" fill="#e2e8f0" stroke="#f59e0b" stroke-width="3"/>
  <text x="835" y="212" font-family="Verdana,Geneva,sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">bitonic_network.v</text>
  <text x="835" y="235" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#334155" text-anchor="middle">pipelined Batcher sort network</text>

  <!-- comparator lanes motif inside the network -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="700" y1="270" x2="970" y2="270"/>
    <line x1="700" y1="300" x2="970" y2="300"/>
    <line x1="700" y1="330" x2="970" y2="330"/>
    <line x1="700" y1="360" x2="970" y2="360"/>
  </g>
  <g stroke="#f59e0b" stroke-width="3" fill="#f59e0b">
    <line x1="740" y1="270" x2="740" y2="300"/><circle cx="740" cy="270" r="4"/><circle cx="740" cy="300" r="4"/>
    <line x1="800" y1="330" x2="800" y2="360"/><circle cx="800" cy="330" r="4"/><circle cx="800" cy="360" r="4"/>
    <line x1="860" y1="270" x2="860" y2="360"/><circle cx="860" cy="270" r="4"/><circle cx="860" cy="360" r="4"/>
    <line x1="920" y1="300" x2="920" y2="330"/><circle cx="920" cy="300" r="4"/><circle cx="920" cy="330" r="4"/>
  </g>
  <text x="835" y="404" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">compare_exchange.v &#215; 80 cells (8 / stage)</text>
  <text x="835" y="424" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">10 comparator stages, 11-cycle pipeline</text>
  <text x="835" y="444" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#475569" text-anchor="middle">MODE flips every comparator (asc / desc)</text>
  <text x="835" y="466" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#0369a1" text-anchor="middle">throughput: 1 tile (16 keys) / clock</text>

  <!-- ======================= Device memory ======================= -->
  <rect x="300" y="630" width="740" height="120" rx="10" fill="#e2e8f0" stroke="#0ea5e9" stroke-width="3"/>
  <text x="670" y="678" font-family="Verdana,Geneva,sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">DEVICE MEMORY</text>
  <text x="670" y="704" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#334155" text-anchor="middle">coalesced beats &#8212; one beat = one tile = N&#215;W = 16&#215;32 = 512 bits</text>
  <text x="670" y="726" font-family="Verdana,Geneva,sans-serif" font-size="13" fill="#475569" text-anchor="middle">source region (unsorted)   &#8226;   destination region (sorted)</text>

  <!-- ============================ ARROWS ============================ -->

  <!-- MMIO control bus: CPU <-> CSR (thin solid = control) -->
  <line x1="220" y1="180" x2="330" y2="180" stroke="#1e293b" stroke-width="2"/>
  <polygon points="330,180 318,174 318,186" fill="#1e293b"/>
  <line x1="330" y1="210" x2="220" y2="210" stroke="#1e293b" stroke-width="2"/>
  <polygon points="220,210 232,204 232,216" fill="#1e293b"/>
  <text x="275" y="150" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">MMIO bus</text>
  <text x="275" y="168" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">mmio_sel, mmio_write,</text>
  <text x="275" y="198" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">mmio_addr[7:0], mmio_wdata[31:0]</text>
  <text x="275" y="228" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">mmio_rdata[31:0]</text>

  <!-- interrupt path: CSR top -> up -> left -> CPU top (red) -->
  <polyline points="520,130 520,60 130,60 130,330" fill="none" stroke="#f87171" stroke-width="3"/>
  <polygon points="130,330 124,318 136,318" fill="#f87171"/>
  <text x="300" y="52" font-family="Verdana,Geneva,sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">irq  (completion interrupt)</text>

  <!-- CSR -> sort_ctrl: descriptor + start (dashed = control) -->
  <line x1="465" y1="280" x2="465" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="465,340 459,328 471,328" fill="#334155"/>
  <text x="472" y="312" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="start">descriptor + start</text>

  <!-- sort_ctrl -> bitonic_network: in_data (thick = datapath) -->
  <line x1="600" y1="380" x2="660" y2="290" stroke="#38bdf8" stroke-width="6"/>
  <polygon points="660,290 646,292 653,303" fill="#38bdf8"/>
  <text x="628" y="352" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">in_data 512b</text>
  <!-- in_valid / in_desc (dashed control) -->
  <line x1="600" y1="410" x2="660" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="660,340 647,341 653,352" fill="#94a3b8"/>
  <text x="632" y="392" font-family="Verdana,Geneva,sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">in_valid/desc</text>

  <!-- bitonic_network -> sort_ctrl: out_data (thick datapath) -->
  <line x1="660" y1="420" x2="600" y2="470" stroke="#38bdf8" stroke-width="6"/>
  <polygon points="600,470 614,468 607,457" fill="#38bdf8"/>
  <text x="632" y="452" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">out_data 512b</text>

  <!-- memory -> sort_ctrl: mem_rd_data (thick up, datapath) -->
  <line x1="380" y1="630" x2="380" y2="520" stroke="#38bdf8" stroke-width="6"/>
  <polygon points="380,520 374,532 386,532" fill="#38bdf8"/>
  <text x="360" y="600" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">mem_rd_data</text>
  <text x="360" y="616" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#38bdf8" text-anchor="end">512b</text>

  <!-- sort_ctrl -> memory: mem_wr_data (thick down, datapath) -->
  <line x1="560" y1="520" x2="560" y2="630" stroke="#38bdf8" stroke-width="6"/>
  <polygon points="560,630 554,618 566,618" fill="#38bdf8"/>
  <text x="580" y="600" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#38bdf8" text-anchor="start">mem_wr_data</text>
  <text x="580" y="616" font-family="Verdana,Geneva,sans-serif" font-size="11" fill="#38bdf8" text-anchor="start">512b</text>

  <!-- sort_ctrl -> memory: read/write addresses + enables (dashed control) -->
  <line x1="470" y1="520" x2="470" y2="630" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="470,630 464,618 476,618" fill="#94a3b8"/>
  <text x="470" y="576" font-family="Verdana,Geneva,sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">mem_rd_en / mem_rd_addr</text>
  <text x="470" y="592" font-family="Verdana,Geneva,sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">mem_wr_en / mem_wr_addr</text>

  <!-- ============================ LEGEND ============================ -->
  <rect x="1055" y="600" width="185" height="150" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="1147" y="626" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Legend</text>
  <line x1="1070" y1="650" x2="1110" y2="650" stroke="#38bdf8" stroke-width="6"/>
  <text x="1118" y="654" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#e2e8f0">datapath 512b</text>
  <line x1="1070" y1="680" x2="1110" y2="680" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1118" y="684" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#e2e8f0">control</text>
  <line x1="1070" y1="710" x2="1110" y2="710" stroke="#1e293b" stroke-width="2"/>
  <text x="1118" y="714" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#e2e8f0">MMIO bus</text>
  <line x1="1070" y1="738" x2="1110" y2="738" stroke="#f87171" stroke-width="3"/>
  <text x="1118" y="742" font-family="Verdana,Geneva,sans-serif" font-size="12" fill="#e2e8f0">interrupt</text>
</svg>
