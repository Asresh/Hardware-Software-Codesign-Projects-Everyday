<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#f5f9fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="205" width="180" height="105" rx="12" fill="#d9f0ff" stroke="#176b87" stroke-width="3"/><text x="125" y="250" font-size="22">CHI-like</text><text x="125" y="280" font-size="22">request channel</text>
    <rect x="270" y="205" width="175" height="105" rx="12" fill="#e9ddff" stroke="#6941a5" stroke-width="3"/><text x="358" y="250" font-size="22">Elastic</text><text x="358" y="280" font-size="22">request FIFO</text>
    <rect x="500" y="120" width="270" height="280" rx="16" fill="#dff7e7" stroke="#247a43" stroke-width="3"/><text x="635" y="165" font-size="24" font-weight="700">2-way directory bank</text><text x="635" y="215" font-size="19">parallel tag compare</text><text x="635" y="250" font-size="19">tag + valid + dirty</text><text x="635" y="285" font-size="19">N-node sharer vector</text><text x="635" y="320" font-size="19">invalid-first / round-robin</text><text x="635" y="355" font-size="19">coherence state update</text>
