    <rect x="410" y="470" width="450" height="85" rx="12" fill="#ffe1e1" stroke="#a63b3b" stroke-width="3"/><text x="635" y="505" font-size="23">APB4 control + coverage-style counters</text><text x="635" y="535" font-size="19">enable • clear • hit/miss/probe/error • W1C IRQ</text>
