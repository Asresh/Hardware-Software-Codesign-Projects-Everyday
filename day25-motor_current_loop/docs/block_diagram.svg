<!-- Author: Asresh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Motor current loop hardware software block diagram</title>
  <desc id="desc">CPU firmware uses selected-ready MMIO to send commands through a four-entry FIFO into error, safety, bit-serial gain, and PWM stages. Completion returns through a sticky interrupt.</desc>
  <defs>
    <marker id="data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#48c9b0"/></marker>
    <marker id="control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f4d03f"/></marker>
    <marker id="irq" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ec7063"/></marker>
  </defs>
  <rect width="1280" height="760" fill="#3d566e"/>
  <text x="40" y="48" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Day 25 — Bit-Serial Motor Current Loop</text>
  <rect x="35" y="85" width="225" height="190" rx="12" fill="#566573" stroke="#d6eaf8" stroke-width="3"/>
  <text x="147" y="125" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">CPU / RTOS</text>
  <text x="55" y="158" fill="#d6eaf8" font-family="monospace" font-size="16">mc_configure()</text>
  <text x="55" y="184" fill="#d6eaf8" font-family="monospace" font-size="16">mc_submit()</text>
  <text x="55" y="210" fill="#d6eaf8" font-family="monospace" font-size="16">mc_isr() / W1C</text>
  <text x="55" y="244" fill="#f9e79f" font-family="Arial, sans-serif" font-size="15">policy, timeout, recovery</text>
  <rect x="320" y="85" width="920" height="595" rx="14" fill="#2f4356" stroke="#aeb6bf" stroke-width="3"/>
  <text x="340" y="120" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">motor_current_mmio_top</text>
  <rect x="355" y="150" width="230" height="170" rx="10" fill="#5b6f82" stroke="#f4d03f" stroke-width="3"/>
  <text x="470" y="183" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">motor_mailbox_regs</text>
  <text x="375" y="215" fill="#f9e79f" font-family="monospace" font-size="14">GAIN_Q8 / TRIP</text>
  <text x="375" y="239" fill="#f9e79f" font-family="monospace" font-size="14">REF / MEAS / DOORBELL</text>
  <text x="375" y="263" fill="#f9e79f" font-family="monospace" font-size="14">DUTY / STATUS / JOBS</text>
  <text x="375" y="287" fill="#f9e79f" font-family="monospace" font-size="14">IRQ_STATUS (W1C)</text>
  <rect x="640" y="155" width="175" height="105" rx="9" fill="#506f70" stroke="#48c9b0" stroke-width="3"/>
  <text x="727" y="189" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">command_fifo</text>
  <text x="727" y="220" text-anchor="middle" fill="#d5f5e3" font-family="Arial, sans-serif" font-size="16">depth = 4</text>
  <text x="727" y="244" text-anchor="middle" fill="#d5f5e3" font-family="monospace" font-size="13">ready / valid</text>
  <rect x="865" y="145" width="170" height="90" rx="9" fill="#506f70" stroke="#48c9b0" stroke-width="3"/>
  <text x="950" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">phase_error</text>
  <text x="950" y="208" text-anchor="middle" fill="#d5f5e3" font-family="monospace" font-size="14">signed 17-bit</text>
  <rect x="865" y="275" width="170" height="100" rx="9" fill="#6c5b3f" stroke="#f4d03f" stroke-width="3"/>
  <text x="950" y="310" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">overcurrent_guard</text>
  <text x="950" y="339" text-anchor="middle" fill="#f9e79f" font-family="monospace" font-size="14">|meas| &gt; TRIP</text>
  <rect x="640" y="355" width="230" height="120" rx="9" fill="#506f70" stroke="#48c9b0" stroke-width="3"/>
  <text x="755" y="390" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">bitserial_gain</text>
  <text x="755" y="420" text-anchor="middle" fill="#d5f5e3" font-family="Arial, sans-serif" font-size="15">8 shift/add iterations</text>
  <text x="755" y="447" text-anchor="middle" fill="#d5f5e3" font-family="monospace" font-size="14">error × GAIN_Q8</text>
  <rect x="960" y="430" width="210" height="115" rx="9" fill="#506f70" stroke="#48c9b0" stroke-width="3"/>
  <text x="1065" y="467" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">pwm_clamp</text>
  <text x="1065" y="497" text-anchor="middle" fill="#d5f5e3" font-family="monospace" font-size="14">Q8 → duty[15:0]</text>
  <text x="1065" y="522" text-anchor="middle" fill="#d5f5e3" font-family="Arial, sans-serif" font-size="14">fault forces zero</text>
  <rect x="750" y="585" width="350" height="55" rx="8" fill="#566573" stroke="#d6eaf8" stroke-width="2"/>
  <text x="925" y="620" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">PWM timer / gate driver / motor phase</text>
  <path d="M260 175 H355" stroke="#f4d03f" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#control)"/>
  <text x="272" y="158" fill="#f9e79f" font-family="monospace" font-size="12">bus_valid_i bus_write_i</text>
  <text x="274" y="193" fill="#f9e79f" font-family="monospace" font-size="12">bus_addr_i[5:0] bus_wdata_i</text>
  <path d="M355 235 H260" stroke="#f4d03f" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#control)"/>
  <text x="270" y="258" fill="#f9e79f" font-family="monospace" font-size="12">bus_ready_o bus_rdata_o</text>
  <path d="M585 205 H640" stroke="#48c9b0" stroke-width="5" marker-end="url(#data)"/>
  <text x="593" y="190" fill="#d5f5e3" font-family="monospace" font-size="12">ref/meas/fault</text>
  <path d="M815 195 H865" stroke="#48c9b0" stroke-width="5" marker-end="url(#data)"/>
  <path d="M950 235 V355 H870" stroke="#48c9b0" stroke-width="5" fill="none" marker-end="url(#data)"/>
  <path d="M870 415 H960" stroke="#48c9b0" stroke-width="5" marker-end="url(#data)"/>
  <text x="884" y="400" fill="#d5f5e3" font-family="monospace" font-size="12">product[24:0]</text>
  <path d="M1035 325 H1105 V430" stroke="#f4d03f" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#control)"/>
  <text x="1060" y="306" fill="#f9e79f" font-family="monospace" font-size="12">trip</text>
  <path d="M1065 545 V585" stroke="#48c9b0" stroke-width="5" marker-end="url(#data)"/>
  <path d="M960 490 H585 V275" stroke="#48c9b0" stroke-width="5" fill="none" marker-end="url(#data)"/>
  <text x="600" y="509" fill="#d5f5e3" font-family="monospace" font-size="12">duty / flags / completion</text>
  <path d="M470 150 V65 H150 V85" stroke="#ec7063" stroke-width="5" fill="none" marker-end="url(#irq)"/>
  <text x="275" y="59" fill="#f5b7b1" font-family="monospace" font-size="14">irq_o (sticky completion/fault)</text>
  <line x1="360" y1="706" x2="420" y2="706" stroke="#48c9b0" stroke-width="5" marker-end="url(#data)"/><text x="435" y="712" fill="#d5f5e3" font-family="Arial, sans-serif" font-size="15">datapath</text>
  <line x1="570" y1="706" x2="630" y2="706" stroke="#f4d03f" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#control)"/><text x="645" y="712" fill="#f9e79f" font-family="Arial, sans-serif" font-size="15">control</text>
  <line x1="775" y1="706" x2="835" y2="706" stroke="#ec7063" stroke-width="5" marker-end="url(#irq)"/><text x="850" y="712" fill="#f5b7b1" font-family="Arial, sans-serif" font-size="15">interrupt</text>
</svg>
