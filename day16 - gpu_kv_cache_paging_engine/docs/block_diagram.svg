<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900">
  <rect x="0" y="0" width="1360" height="900" fill="#39424f"/>
  <text x="28" y="42" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Day 16 - KV-cache paging engine: block diagram</text>
  <text x="28" y="70" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#c3d2e2">solid arrows = datapath / bus traffic &#183; dashed arrows = control &amp; status &#183; dotted = interrupt</text>

  <!-- ================= host ================= -->
  <rect x="40" y="110" width="250" height="150" rx="10" fill="#4e6785" stroke="#dce8f4" stroke-width="3"/>
  <text x="165" y="145" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">HOST CPU</text>
  <text x="165" y="172" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#e2ecf6" text-anchor="middle">serving runtime</text>
  <text x="165" y="196" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#c3d2e2" text-anchor="middle">sw/kvp_driver.c</text>
  <text x="165" y="220" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#c3d2e2" text-anchor="middle">builds request words,</text>
  <text x="165" y="240" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#c3d2e2" text-anchor="middle">seeds the block pool</text>

  <!-- MMIO bus -->
  <rect x="40" y="300" width="250" height="54" rx="8" fill="#2f3b4c" stroke="#9fb6cd" stroke-width="2"/>
  <text x="165" y="323" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">MMIO (32-bit)</text>
  <text x="165" y="344" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2" text-anchor="middle">reg_wr / reg_rd / reg_addr[7:0] / reg_wdata / reg_rdata</text>
  <line x1="165" y1="260" x2="165" y2="300" stroke="#dce8f4" stroke-width="3" stroke-dasharray="7 5"/>

  <!-- ================= engine boundary ================= -->
  <rect x="330" y="100" width="700" height="700" rx="14" fill="#333e4d" stroke="#8fa8c2" stroke-width="3"/>
  <text x="350" y="130" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffffff">kvp_top</text>

  <!-- regfile -->
  <rect x="356" y="150" width="240" height="150" rx="9" fill="#4b6f8f" stroke="#dce8f4" stroke-width="3"/>
  <text x="476" y="176" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">kvp_regfile</text>
  <text x="476" y="200" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e2ecf6" text-anchor="middle">CTRL / STATUS / bases</text>
  <text x="476" y="220" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e2ecf6" text-anchor="middle">FREE_PUSH, REQ_COUNT</text>
  <text x="476" y="240" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e2ecf6" text-anchor="middle">7 statistics counters</text>
  <text x="476" y="262" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2" text-anchor="middle">sticky DONE / OOM / BUS</text>
  <text x="476" y="284" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2" text-anchor="middle">IRQ_ACK = W1C</text>
  <line x1="290" y1="327" x2="356" y2="240" stroke="#dce8f4" stroke-width="3" stroke-dasharray="7 5"/>

  <!-- core -->
  <rect x="356" y="340" width="240" height="230" rx="9" fill="#57708f" stroke="#dce8f4" stroke-width="3"/>
  <text x="476" y="366" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">kvp_core</text>
  <text x="476" y="388" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e2ecf6" text-anchor="middle">sequencer / block-table walker</text>
  <text x="372" y="414" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#dbe7f3">FETCH &#8594; XL &#8594; BT_RD &#8594; BT_WR</text>
  <text x="372" y="434" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#dbe7f3">&#8594; RES_WR (lookahead probe)</text>
  <text x="372" y="454" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#dbe7f3">FREE_RD &#8594; FREE_WR</text>
  <text x="372" y="480" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">every state advances only</text>
  <text x="372" y="500" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">on m_done: lossless stalls</text>
  <text x="372" y="526" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">seq_row = seq * BT_STRIDE</text>
  <text x="372" y="548" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">(one multiply per request)</text>
  <line x1="476" y1="300" x2="476" y2="340" stroke="#dce8f4" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="486" y="326" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2">start / bases / stat_clr</text>

  <!-- tlb -->
  <rect x="660" y="150" width="330" height="200" rx="9" fill="#6a5b93" stroke="#e6ddf4" stroke-width="3"/>
  <text x="825" y="176" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">kvp_tlb - translation cache</text>
  <text x="825" y="200" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#eae3f7" text-anchor="middle">SETS=16 x WAYS=4 = 64 entries</text>
  <text x="678" y="226" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#eae3f7">key = {seq_id[11:0], logical[15:0]}</text>
  <text x="678" y="246" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#eae3f7">index = key[3:0], tag = key[27:4]</text>
  <text x="678" y="266" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#eae3f7">4 parallel tag compares (1 cycle)</text>
  <text x="678" y="292" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#d6cbea">true LRU: move-to-front order vector</text>
  <text x="678" y="312" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#d6cbea">victim = lowest invalid way, else LRU</text>
  <text x="678" y="336" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#d6cbea">ports: touch / fill / inv / flush</text>
  <line x1="596" y1="400" x2="660" y2="300" stroke="#f0e6ff" stroke-width="3"/>
  <text x="600" y="352" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#e6ddf4">probe_key &#8594;</text>
  <text x="600" y="370" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#e6ddf4">&#8592; hit / phys</text>

  <!-- freelist -->
  <rect x="660" y="390" width="330" height="180" rx="9" fill="#3f7f6d" stroke="#d8f0e8" stroke-width="3"/>
  <text x="825" y="416" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">kvp_freelist - block allocator</text>
  <text x="825" y="440" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e2f5ef" text-anchor="middle">LIFO stack, DEPTH=512 x 24-bit</text>
  <text x="678" y="466" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e2f5ef">pop  &#8594; allocate a physical KV block</text>
  <text x="678" y="486" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e2f5ef">push &#8592; sequence freed / host seeds pool</text>
  <text x="678" y="512" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9e6dd">top_blk read combinationally, so the</text>
  <text x="678" y="532" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9e6dd">block-table write issues the same cycle</text>
  <text x="678" y="556" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c9e6dd">empty &#8594; OOM result + sticky IRQ</text>
  <line x1="596" y1="470" x2="660" y2="470" stroke="#d8f0e8" stroke-width="3"/>
  <text x="600" y="462" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d8f0e8">pop / push</text>

  <!-- wb master -->
  <rect x="356" y="610" width="634" height="160" rx="9" fill="#8a6a4a" stroke="#f2e3d4" stroke-width="3"/>
  <text x="673" y="636" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">kvp_wb_master - Wishbone B4 classic master</text>
  <text x="374" y="662" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f6ece2">CYC_O / STB_O / WE_O / ADR_O[31:0] / DAT_O[31:0] / SEL_O=4'hF &#8594;</text>
  <text x="374" y="684" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#f6ece2">&#8592; ACK_I / DAT_I[31:0] / ERR_I</text>
  <text x="374" y="710" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8d5c2">one outstanding transaction; a zero-wait-state ACK_I in the STB_O cycle</text>
  <text x="374" y="730" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8d5c2">gives one transaction per clock - wait states just stretch the cycle</text>
  <text x="374" y="754" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#e8d5c2">256-cycle watchdog on an unacknowledged cycle &#8594; m_err (bus hang)</text>
  <line x1="476" y1="570" x2="476" y2="610" stroke="#f2e3d4" stroke-width="3"/>
  <text x="486" y="596" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#e8d5c2">m_req / m_addr / m_wdata &#8594; &#8592; m_done / m_rdata / m_err</text>

  <!-- ================= system memory ================= -->
  <rect x="1070" y="150" width="260" height="620" rx="12" fill="#2f3b4c" stroke="#9fb6cd" stroke-width="3"/>
  <text x="1200" y="180" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SYSTEM MEMORY</text>
  <text x="1200" y="202" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2" text-anchor="middle">Wishbone B4 slave</text>

  <rect x="1092" y="222" width="216" height="150" rx="8" fill="#4a5c73" stroke="#dce8f4" stroke-width="2"/>
  <text x="1200" y="246" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">block table</text>
  <text x="1200" y="268" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dbe7f3" text-anchor="middle">BT_BASE + (seq*STRIDE + idx)*4</text>
  <text x="1200" y="290" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dbe7f3" text-anchor="middle">32 rows x 64 entries</text>
  <text x="1200" y="312" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">0xFFFFFFFF = unmapped</text>
  <text x="1200" y="336" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">read on a cache miss,</text>
  <text x="1200" y="356" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">written on allocate / free</text>

  <rect x="1092" y="392" width="216" height="120" rx="8" fill="#4a5c73" stroke="#dce8f4" stroke-width="2"/>
  <text x="1200" y="416" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">request array</text>
  <text x="1200" y="438" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dbe7f3" text-anchor="middle">REQ_BASE, REQ_COUNT words</text>
  <text x="1200" y="462" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">{op[3:0], seq[11:0], arg[15:0]}</text>
  <text x="1200" y="486" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">XLATE / RANGE / NOALLOC</text>
  <text x="1200" y="504" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">FREE / FLUSH</text>

  <rect x="1092" y="532" width="216" height="118" rx="8" fill="#4a5c73" stroke="#dce8f4" stroke-width="2"/>
  <text x="1200" y="556" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">result array</text>
  <text x="1200" y="578" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dbe7f3" text-anchor="middle">RES_BASE, one word per</text>
  <text x="1200" y="596" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dbe7f3" text-anchor="middle">translation</text>
  <text x="1200" y="620" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">{flags[7:0], phys_block[23:0]}</text>
  <text x="1200" y="640" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c3d2e2" text-anchor="middle">HIT / ALLOC / FREED / errors</text>

  <text x="1200" y="686" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2" text-anchor="middle">the attention kernels read the</text>
  <text x="1200" y="706" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2" text-anchor="middle">result array as their KV block</text>
  <text x="1200" y="726" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2" text-anchor="middle">table for the batch</text>

  <!-- bus arrows -->
  <line x1="990" y1="672" x2="1070" y2="672" stroke="#f2e3d4" stroke-width="4"/>
  <polygon points="1070,672 1058,666 1058,678" fill="#f2e3d4"/>
  <line x1="1070" y1="700" x2="990" y2="700" stroke="#f2e3d4" stroke-width="4"/>
  <polygon points="990,700 1002,694 1002,706" fill="#f2e3d4"/>
  <text x="1030" y="664" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#f2e3d4" text-anchor="middle">req</text>
  <text x="1030" y="722" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#f2e3d4" text-anchor="middle">ack/data</text>

  <!-- interrupt path (routed above the host box so nothing overlaps) -->
  <polyline points="356,160 318,160 318,92 165,92 165,104" fill="none" stroke="#ffd479" stroke-width="3" stroke-dasharray="3 5"/>
  <polygon points="165,112 159,100 171,100" fill="#ffd479"/>
  <text x="240" y="84" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#ffd479" text-anchor="middle">irq = DONE | OOM | BUS (gated by CTRL.IRQ_EN)</text>

  <!-- legend -->
  <rect x="40" y="700" width="250" height="100" rx="8" fill="#2f3b4c" stroke="#9fb6cd" stroke-width="2"/>
  <text x="56" y="726" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">measured (Icarus)</text>
  <text x="56" y="748" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">0.970 translations/clock peak</text>
  <text x="56" y="768" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">3-cycle cached translation</text>
  <text x="56" y="788" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">13.02x / 20.42x over scalar</text>

  <!-- flow note -->
  <rect x="40" y="390" width="250" height="290" rx="8" fill="#2f3b4c" stroke="#9fb6cd" stroke-width="2"/>
  <text x="56" y="416" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">walk of one translation</text>
  <text x="56" y="442" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">1. probe cache (1 cycle)</text>
  <text x="56" y="464" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">2. hit &#8594; write {HIT, phys}</text>
  <text x="56" y="486" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">3. miss &#8594; read BT entry</text>
  <text x="56" y="508" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">4. valid &#8594; fill cache, write</text>
  <text x="56" y="530" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">5. unmapped &#8594; pop pool,</text>
  <text x="56" y="550" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">    write BT entry, fill,</text>
  <text x="56" y="570" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">    write {ALLOC, phys}</text>
  <text x="56" y="596" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#c3d2e2">6. pool empty &#8594; OOM + IRQ</text>
  <text x="56" y="626" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a9c6e0">RANGE absorbs the next key</text>
  <text x="56" y="646" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a9c6e0">while the current result is</text>
  <text x="56" y="666" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#a9c6e0">on the bus &#8594; 1 xlat/clock</text>
</svg>
