<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" width="1260" height="900">
  <rect x="0" y="0" width="1260" height="900" fill="#3b4451"/>

  <text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#f2f6fa">Day 17 - sharded embedding gather-reduce engine (emb_top)</text>
  <text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b9c8d6">solid arrows = datapath (128-bit AXI4 beats) &#183; dashed arrows = control / handshake &#183; dotted = interrupt</text>

  <!-- ============================ legend ============================ -->
  <rect x="960" y="20" width="276" height="86" rx="6" fill="#2b3340" stroke="#63748a" stroke-width="1.2"/>
  <line x1="976" y1="42" x2="1024" y2="42" stroke="#7fc9f2" stroke-width="3"/>
  <text x="1032" y="47" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dce8f3">datapath (LANES x 32 bits)</text>
  <line x1="976" y1="64" x2="1024" y2="64" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="1032" y="69" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dce8f3">control / handshake</text>
  <line x1="976" y1="86" x2="1024" y2="86" stroke="#f2707c" stroke-width="2.4" stroke-dasharray="2 4"/>
  <text x="1032" y="91" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#dce8f3">interrupt</text>

  <!-- ============================ host CPU ============================ -->
  <rect x="24" y="86" width="228" height="118" rx="8" fill="#1d2833" stroke="#9fb3c8" stroke-width="2"/>
  <text x="138" y="114" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#f2f6fa" text-anchor="middle">host CPU</text>
  <text x="138" y="136" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#a8c0d6" text-anchor="middle">sw/emb_driver.c</text>
  <text x="36" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fd694">builds the descriptor ring</text>
  <text x="36" y="174" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fd694">declares the shard window</text>
  <text x="36" y="190" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fd694">services the completion IRQ</text>

  <!-- MMIO bus label -->
  <line x1="252" y1="126" x2="356" y2="126" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="356,126 346,121 346,131" fill="#e0a33e"/>
  <text x="304" y="118" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#e0a33e" text-anchor="middle">MMIO</text>
  <text x="304" y="148" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c9a86a" text-anchor="middle">reg_sel / reg_we</text>
  <text x="304" y="162" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c9a86a" text-anchor="middle">reg_addr[7:0]</text>
  <text x="304" y="176" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#c9a86a" text-anchor="middle">reg_wdata/rdata[31:0]</text>

  <!-- ============================ regfile ============================ -->
  <rect x="356" y="86" width="248" height="140" rx="8" fill="#2f4a63" stroke="#7fc9f2" stroke-width="2"/>
  <text x="480" y="112" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#f2f6fa" text-anchor="middle">emb_regfile</text>
  <text x="480" y="130" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#a8c0d6" text-anchor="middle">control / status plane</text>
  <text x="368" y="152" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">CTRL  START | SINGLE_BUF | IRQ_EN</text>
  <text x="368" y="168" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">DESC_BASE / COUNT, IDX / TAB / OUT_BASE</text>
  <text x="368" y="184" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">SHARD_LO, SHARD_HI, TABLE_ROWS</text>
  <text x="368" y="200" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">ST_DESC/IDX/LOCAL/REMOTE/INVALID</text>
  <text x="368" y="216" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">ST_RBEATS / WBEATS / CYCLES, ID</text>

  <!-- interrupt path -->
  <path d="M 480 226 L 480 254 L 138 254 L 138 204" fill="none" stroke="#f2707c" stroke-width="2.4" stroke-dasharray="2 4"/>
  <polygon points="138,204 133,215 143,215" fill="#f2707c"/>
  <text x="300" y="270" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#f2707c" text-anchor="middle">irq  (done | error, sticky, W1C via IRQ register)</text>

  <!-- ============================ core ============================ -->
  <rect x="356" y="300" width="248" height="240" rx="8" fill="#2f4a63" stroke="#7fc9f2" stroke-width="2"/>
  <text x="480" y="326" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#f2f6fa" text-anchor="middle">emb_core</text>
  <text x="480" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#a8c0d6" text-anchor="middle">descriptor-ring walker + gather sequencer</text>
  <text x="368" y="368" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">1  fetch descriptor  (8 words / LANES beats)</text>
  <text x="368" y="384" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">2  fetch bag  (ceil(num_idx/LANES) beats)</text>
  <text x="368" y="400" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">3  classify index vs [SHARD_LO, SHARD_HI)</text>
  <text x="382" y="416" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#8fd694">local &#8594; gather row, CHUNKS beats</text>
  <text x="382" y="432" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#e0a33e">remote &#8594; skip, count for all-to-all</text>
  <text x="382" y="448" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#f2707c">&#8805; TABLE_ROWS &#8594; index error</text>
  <text x="368" y="466" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3">4  flush, then write CHUNKS beats out</text>
  <rect x="368" y="478" width="224" height="50" rx="5" fill="#1d2833" stroke="#63748a" stroke-width="1.2"/>
  <text x="378" y="496" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#b9c8d6">bag index buffer  MAX_BAG x 32 bits</text>
  <text x="378" y="512" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#b9c8d6">bus watchdog 1024 cycles &#8594; abort, never hang</text>
  <text x="378" y="524" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#b9c8d6">SLVERR / DECERR &#8594; sticky ERR_BUS</text>

  <!-- regfile -> core control -->
  <line x1="480" y1="226" x2="480" y2="300" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="480,300 475,289 485,289" fill="#e0a33e"/>
  <text x="492" y="266" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#e0a33e">start, single_buf, bases</text>
  <text x="492" y="284" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#e0a33e">ev_* statistics pulses back</text>

  <!-- ============================ accumulator ============================ -->
  <rect x="668" y="292" width="392" height="290" rx="8" fill="#33553f" stroke="#8fd694" stroke-width="2"/>
  <text x="864" y="318" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#f2f6fa" text-anchor="middle">emb_accum  -  double-buffered pooling datapath</text>

  <!-- ping-pong buffers -->
  <rect x="686" y="334" width="164" height="86" rx="6" fill="#1d2833" stroke="#e0a33e" stroke-width="2"/>
  <text x="768" y="354" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#e0a33e" text-anchor="middle">emb_stage_buf</text>
  <text x="768" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3" text-anchor="middle">buffer A: CHUNKS x LANES x 32</text>
  <text x="768" y="388" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3" text-anchor="middle">buffer B: CHUNKS x LANES x 32</text>
  <text x="768" y="406" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#9fb3c8" text-anchor="middle">16 beats each @ EMB_DIM=64</text>

  <!-- reduce lanes -->
  <rect x="866" y="334" width="184" height="86" rx="6" fill="#1d2833" stroke="#8fd694" stroke-width="2"/>
  <text x="958" y="354" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#8fd694" text-anchor="middle">emb_reduce_lane x LANES</text>
  <text x="958" y="372" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3" text-anchor="middle">SUM / MEAN: 32-bit wrap add</text>
  <text x="958" y="388" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3" text-anchor="middle">MAX / MIN: signed compare-select</text>
  <text x="958" y="406" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#9fb3c8" text-anchor="middle">first=1 initialises, no sentinel needed</text>

  <line x1="850" y1="377" x2="866" y2="377" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="866,377 856,372 856,382" fill="#7fc9f2"/>

  <!-- accumulator -->
  <rect x="686" y="436" width="164" height="64" rx="6" fill="#1d2833" stroke="#7fc9f2" stroke-width="2"/>
  <text x="768" y="456" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#7fc9f2" text-anchor="middle">accumulator RAM</text>
  <text x="768" y="474" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#dce8f3" text-anchor="middle">CHUNKS x LANES x 32 bits</text>
  <text x="768" y="490" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#9fb3c8" text-anchor="middle">1 chunk folded per clock</text>

  <!-- dividers -->
  <rect x="866" y="436" width="184" height="64" rx="6" fill="#1d2833" stroke="#c9a0f0" stroke-width="2"/>
  <text x="958" y="456" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#c9a0f0" text-anchor="middle">emb_divu x LANES</text>
  <text x="958" y="474" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3" text-anchor="middle">34-stage restoring divide</text>
  <text x="958" y="490" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#9fb3c8" text-anchor="middle">MEAN only, divide-in-place, trunc toward 0</text>

  <path d="M 850 468 L 866 468" fill="none" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="866,468 856,463 856,473" fill="#7fc9f2"/>
  <path d="M 958 500 L 958 516 L 768 516 L 768 500" fill="none" stroke="#c9a0f0" stroke-width="2.4"/>
  <polygon points="768,500 763,511 773,511" fill="#c9a0f0"/>

  <line x1="958" y1="420" x2="958" y2="436" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="958,436 953,425 963,425" fill="#7fc9f2"/>
  <line x1="768" y1="420" x2="768" y2="436" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="768,436 763,425 773,425" fill="#7fc9f2"/>

  <text x="686" y="546" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fd694">row i+1 fills one buffer while row i folds out of the other:</text>
  <text x="686" y="562" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8fd694">the CHUNKS-beat burst and the CHUNKS-cycle fold overlap exactly.</text>
  <text x="686" y="576" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#e0a33e">CTRL.SINGLE_BUF collapses them to one buffer: same result, 1.667x the cycles.</text>

  <!-- core <-> accum -->
  <line x1="604" y1="380" x2="668" y2="380" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="668,380 658,375 658,385" fill="#e0a33e"/>
  <text x="636" y="372" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#e0a33e" text-anchor="middle">f_avail</text>
  <line x1="604" y1="420" x2="668" y2="420" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="668,420 658,415 658,425" fill="#e0a33e"/>
  <text x="636" y="412" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#e0a33e" text-anchor="middle">f_first, clr</text>
  <line x1="604" y1="460" x2="668" y2="460" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="668,460 658,455 658,465" fill="#e0a33e"/>
  <text x="636" y="452" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#e0a33e" text-anchor="middle">d_start, d_count</text>

  <!-- ============================ AXI masters ============================ -->
  <rect x="188" y="612" width="272" height="120" rx="8" fill="#4a3a5c" stroke="#c9a0f0" stroke-width="2"/>
  <text x="324" y="638" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#f2f6fa" text-anchor="middle">emb_axi_read</text>
  <text x="324" y="656" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#a8c0d6" text-anchor="middle">AXI4 burst read master, 1 outstanding</text>
  <text x="200" y="676" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">ARVALID/ARREADY, ARADDR, ARLEN, ARSIZE=4, ARBURST=INCR</text>
  <text x="200" y="692" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">RVALID/RREADY, RDATA[127:0], RRESP, RLAST</text>
  <text x="200" y="710" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#e0a33e">AR bypass: address on the bus the cycle it is requested</text>
  <text x="200" y="724" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#e0a33e">RREADY = consumer ready &#8594; stalls losslessly</text>

  <rect x="668" y="612" width="272" height="120" rx="8" fill="#4a3a5c" stroke="#c9a0f0" stroke-width="2"/>
  <text x="804" y="638" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#f2f6fa" text-anchor="middle">emb_axi_write</text>
  <text x="804" y="656" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#a8c0d6" text-anchor="middle">AXI4 burst write master, 1 outstanding</text>
  <text x="680" y="676" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">AWVALID/AWREADY, AWADDR, AWLEN, AWSIZE=4, AWBURST=INCR</text>
  <text x="680" y="692" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">WVALID/WREADY, WDATA[127:0], WSTRB=all, WLAST</text>
  <text x="680" y="708" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">BVALID/BREADY, BRESP</text>
  <text x="680" y="724" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#e0a33e">W beats may lag AW: the MEAN divider pass runs first</text>

  <!-- core -> read master (request) -->
  <path d="M 400 540 L 400 578 L 324 578 L 324 612" fill="none" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="324,612 319,601 329,601" fill="#e0a33e"/>
  <text x="336" y="572" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#e0a33e">req {addr, len}</text>

  <!-- read master -> core / accum (data) -->
  <path d="M 460 660 L 540 660 L 540 540" fill="none" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="540,540 535,551 545,551" fill="#7fc9f2"/>
  <text x="548" y="638" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#7fc9f2">descriptor + index words</text>

  <path d="M 460 700 L 620 700 L 620 470 L 686 470" fill="none" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="686,470 676,465 676,475" fill="#7fc9f2"/>
  <text x="474" y="694" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#7fc9f2">row beats &#8594; staging buffer</text>

  <!-- accum -> write master (pooled vector) -->
  <path d="M 1006 582 L 1006 596 L 872 596 L 872 612" fill="none" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="872,612 867,601 877,601" fill="#7fc9f2"/>
  <text x="1064" y="586" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#7fc9f2">pooled vector</text>

  <!-- core -> write master (request) -->
  <path d="M 560 540 L 560 596 L 720 596 L 720 612" fill="none" stroke="#e0a33e" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="720,612 715,601 725,601" fill="#e0a33e"/>
  <text x="654" y="608" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#e0a33e" text-anchor="middle">req {out_base + dst_off, CHUNKS-1}</text>

  <!-- ============================ shared memory ============================ -->
  <rect x="188" y="782" width="752" height="96" rx="8" fill="#1d2833" stroke="#9fb3c8" stroke-width="2"/>
  <text x="564" y="808" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#f2f6fa" text-anchor="middle">shared device memory  (AXI4, 128-bit data)</text>
  <rect x="204" y="822" width="164" height="42" rx="5" fill="#3b4451" stroke="#63748a" stroke-width="1.2"/>
  <text x="286" y="840" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#dce8f3" text-anchor="middle">descriptor ring</text>
  <text x="286" y="855" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#9fb3c8" text-anchor="middle">8 words: op, n, idx_off, dst_off</text>
  <rect x="380" y="822" width="164" height="42" rx="5" fill="#3b4451" stroke="#63748a" stroke-width="1.2"/>
  <text x="462" y="840" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#dce8f3" text-anchor="middle">index arena</text>
  <text x="462" y="855" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#9fb3c8" text-anchor="middle">bags, beat-aligned</text>
  <rect x="556" y="822" width="184" height="42" rx="5" fill="#3b4451" stroke="#8fd694" stroke-width="1.5"/>
  <text x="648" y="840" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#dce8f3" text-anchor="middle">local embedding shard</text>
  <text x="648" y="855" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#9fb3c8" text-anchor="middle">rows [SHARD_LO, SHARD_HI) x EMB_DIM</text>
  <rect x="752" y="822" width="172" height="42" rx="5" fill="#3b4451" stroke="#7fc9f2" stroke-width="1.5"/>
  <text x="838" y="840" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#dce8f3" text-anchor="middle">pooled output region</text>
  <text x="838" y="855" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#9fb3c8" text-anchor="middle">one EMB_DIM vector per bag</text>

  <line x1="324" y1="782" x2="324" y2="732" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="324,732 319,743 329,743" fill="#7fc9f2"/>
  <line x1="804" y1="732" x2="804" y2="782" stroke="#7fc9f2" stroke-width="3"/>
  <polygon points="804,782 799,771 809,771" fill="#7fc9f2"/>

  <!-- side note -->
  <rect x="968" y="782" width="268" height="96" rx="6" fill="#2b3340" stroke="#63748a" stroke-width="1.2"/>
  <text x="982" y="804" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#e0a33e">why remote indices are not an error</text>
  <text x="982" y="822" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">Each device owns one slice of the global</text>
  <text x="982" y="836" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">table. Indices outside the slice belong to a</text>
  <text x="982" y="850" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">peer, so they are skipped and counted in</text>
  <text x="982" y="864" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#dce8f3">ST_REMOTE, which sizes the all-to-all.</text>
</svg>
