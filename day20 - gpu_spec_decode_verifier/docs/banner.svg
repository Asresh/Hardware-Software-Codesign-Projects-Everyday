<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <rect x="0" y="0" width="1200" height="300" fill="#2f2b42"/>
  <rect x="0" y="0" width="1200" height="8" fill="#a892d8"/>
  <rect x="0" y="292" width="1200" height="8" fill="#a892d8"/>

  <!-- day badge -->
  <rect x="44" y="60" width="150" height="150" rx="14" fill="#453f5e" stroke="#b7a6e0" stroke-width="3"/>
  <text x="119" y="128" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#cfc6e6" text-anchor="middle">DAY</text>
  <text x="119" y="188" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">20</text>

  <!-- title -->
  <text x="234" y="106" font-family="Helvetica,Arial,sans-serif" font-size="42" font-weight="bold" fill="#ffffff">Speculative Decode Verifier</text>
  <text x="234" y="150" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#c6bce0">draft-tree acceptance in hardware &#183; one token per clock</text>
  <text x="234" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#a99ec4">broadcast candidate mask &#183; log-depth argmax tree &#183; APB3 + AXI4-Stream</text>

  <!-- a draft tree with the accepted path picked out -->
  <g>
    <!-- edges: rejected branches first, so the accepted path draws over them -->
    <path d="M 900 88 L 848 132" stroke="#6d6486" stroke-width="2.5" fill="none"/>
    <path d="M 900 88 L 1000 132" stroke="#6d6486" stroke-width="2.5" fill="none"/>
    <path d="M 952 132 L 906 176" stroke="#6d6486" stroke-width="2.5" fill="none"/>
    <path d="M 1000 132 L 1046 176" stroke="#6d6486" stroke-width="2.5" fill="none"/>
    <path d="M 1000 176 L 962 220" stroke="#6d6486" stroke-width="2.5" fill="none"/>

    <!-- the accepted path: root -> depth 3 -->
    <path d="M 900 88 L 952 132" stroke="#8fd0b0" stroke-width="5" fill="none"/>
    <path d="M 952 132 L 1000 176" stroke="#8fd0b0" stroke-width="5" fill="none"/>
    <path d="M 1000 176 L 1052 220" stroke="#8fd0b0" stroke-width="5" fill="none"/>

    <!-- rejected nodes -->
    <circle cx="848" cy="132" r="15" fill="#3c3752" stroke="#6d6486" stroke-width="2.5"/>
    <circle cx="1000" cy="132" r="15" fill="#3c3752" stroke="#6d6486" stroke-width="2.5"/>
    <circle cx="906" cy="176" r="15" fill="#3c3752" stroke="#6d6486" stroke-width="2.5"/>
    <circle cx="1046" cy="176" r="15" fill="#3c3752" stroke="#6d6486" stroke-width="2.5"/>
    <circle cx="962" cy="220" r="15" fill="#3c3752" stroke="#6d6486" stroke-width="2.5"/>

    <!-- root and accepted nodes -->
    <circle cx="900" cy="88"  r="17" fill="#b7a6e0" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="952" cy="132" r="17" fill="#8fd0b0" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="1000" cy="176" r="17" fill="#8fd0b0" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="1052" cy="220" r="17" fill="#8fd0b0" stroke="#ffffff" stroke-width="2.5"/>
    <!-- the bonus token the target model supplies for free -->
    <circle cx="1104" cy="264" r="14" fill="#2f2b42" stroke="#e8b45c" stroke-width="3"/>

    <text x="838" y="252" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#8fd0b0">accepted path</text>
    <text x="838" y="274" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#e8b45c">bonus token</text>
  </g>

  <!-- pipeline strip -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle">
    <rect x="236" y="222" width="118" height="42" rx="6" fill="#3c3752" stroke="#b7a6e0" stroke-width="2"/>
    <text x="295" y="249" fill="#e4dcf4">LOAD</text>
    <rect x="366" y="222" width="118" height="42" rx="6" fill="#3c3752" stroke="#b7a6e0" stroke-width="2"/>
    <text x="425" y="249" fill="#e4dcf4">CHECK</text>
    <rect x="496" y="222" width="118" height="42" rx="6" fill="#3c3752" stroke="#8fd0b0" stroke-width="2"/>
    <text x="555" y="249" fill="#e4dcf4">WALK</text>
    <rect x="626" y="222" width="118" height="42" rx="6" fill="#3c3752" stroke="#b7a6e0" stroke-width="2"/>
    <text x="685" y="249" fill="#e4dcf4">TRAIL</text>
    <path d="M 354 243 L 364 243" stroke="#b7a6e0" stroke-width="2.5"/>
    <path d="M 484 243 L 494 243" stroke="#b7a6e0" stroke-width="2.5"/>
    <path d="M 614 243 L 624 243" stroke="#b7a6e0" stroke-width="2.5"/>
  </g>
</svg>
